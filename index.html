<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FBF7F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garde-Manger">
<title>Mon Garde-Manger</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23E8613C'/><text x='50' y='68' font-size='56' text-anchor='middle'>🥘</text></svg>">
<style>
:root{--bg:#FBF7F1;--card:#fff;--ink:#1E1B18;--mu:#7A7068;--line:#EFE7DD;--soft:#F4EDE4;--pri:#E8613C;--pri2:#F08A5D;--pri-soft:#FDEDE6;--ok:#2F9E6E;--ok-soft:#E3F4EC;--warn:#E9A23B;--dan:#D9483B;
--r:20px;--sh:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.07);--sh2:0 18px 50px rgba(40,25,10,.18);--ease:cubic-bezier(.2,.8,.2,1);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);overflow-x:hidden}
main{overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 12px) 18px 10px;background:rgba(251,247,241,.86);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:17px;letter-spacing:-.02em;display:block}.brand small{color:var(--mu);font-size:12.5px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px rgba(232,97,60,.35)}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
main{padding:4px 18px calc(110px + var(--safe-b));max-width:760px;margin:0 auto}
.view{animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.03em;line-height:1.15;margin:6px 0 4px}
h2{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}.sec h3{font-size:18px;letter-spacing:-.02em}.sec a{color:var(--pri);font-weight:650;font-size:14px;cursor:pointer}
.mu{color:var(--mu)}.small{font-size:13px}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:30;display:flex;gap:2px;padding:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;box-shadow:var(--sh2);width:min(440px,calc(100% - 24px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:18px;color:#9A9089;font-size:10.5px;font-weight:650;position:relative;transition:color .2s}
.tabbar button.on{color:var(--pri)}
.tabbar button.on:before{content:'';position:absolute;inset:0;border-radius:18px;background:var(--pri-soft);z-index:-1;animation:pop .35s var(--ease)}
.tabbar .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--pri);color:#fff;font-size:10px;display:grid;place-items:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* search */
.search{min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 6px 0 14px;box-shadow:var(--sh);height:52px}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.search svg{color:var(--mu)}
.fbtn{height:40px;padding:0 12px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;font-weight:650;font-size:14px;position:relative;transition:transform .15s}
.fbtn svg{width:18px;height:18px}.fbtn:active{transform:scale(.94)}
.fbtn i{position:absolute;top:-5px;right:-5px;background:var(--pri);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--bg)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;height:38px;padding:0 15px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;transition:all .2s var(--ease);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip:active{transform:scale(.95)}
.chip.x{background:var(--pri-soft);color:var(--pri);box-shadow:none;height:32px;font-size:13px;padding:0 10px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.rc{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .2s var(--ease);animation:cardIn .5s var(--ease) both;text-align:left;display:block;width:100%}
.rc:active{transform:scale(.97)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.rc .ph{aspect-ratio:4/3.3}
.rc .bd{padding:10px 12px 12px}.rc .bd b{display:block;font-size:14.5px;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .meta{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--mu);font-size:12.5px}
.ph{position:relative;overflow:hidden;background:linear-gradient(110deg,#F1E8DD 30%,#F8F2EA 50%,#F1E8DD 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;display:grid;place-items:center}
.ph.done{animation:none;background:linear-gradient(135deg,#FCE9DD,#F7EFE3)}
.ph .emo{font-size:42px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.08))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .6s var(--ease);transform:scale(1.04)}
.ph img.ok{opacity:1;transform:none}
.ph img.ok~.emo{display:none}
@keyframes shimmer{to{background-position:-200% 0}}
.tag{position:absolute;z-index:2;top:8px;left:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:9px;padding:3px 8px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px}
.heart{position:absolute;z-index:2;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:transform .2s}
.heart svg{width:18px;height:18px}.heart.on{color:var(--pri)}.heart.on svg{fill:currentColor;animation:beat .45s var(--ease)}
@keyframes beat{30%{transform:scale(1.35)}}
.dots{display:inline-flex;gap:2px}.dots i{width:6px;height:6px;border-radius:50%;background:#E5DCD1}.dots i.f{background:var(--pri)}
.match{height:5px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}.match i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#56C08E);border-radius:3px;transition:width .8s var(--ease)}
/* carrousel */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:4px 18px 10px}.rail::-webkit-scrollbar{display:none}
.rail .rc{flex:none;width:168px;scroll-snap-align:start}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--sh2);cursor:pointer;margin-top:14px;animation:cardIn .6s var(--ease) both;color:#fff}
.hero .ph{aspect-ratio:16/11}
.hero .ov{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(20,10,5,.78));display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.hero small{text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:11px;opacity:.9}
.hero h2{font-size:26px;margin:4px 0 6px;color:#fff}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap}.hero .pills span{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:650}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:var(--card);border-radius:18px;padding:12px 4px 10px;text-align:center;box-shadow:var(--sh);font-size:12px;font-weight:650;transition:transform .15s;animation:cardIn .5s var(--ease) both}
.cat span{display:block;font-size:26px;margin-bottom:4px}.cat:active{transform:scale(.94)}
/* boutons */
.btn{height:52px;border-radius:16px;padding:0 20px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 10px 24px rgba(232,97,60,.32)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.btn.w{width:100%}.btn.sm{height:40px;border-radius:12px;font-size:14px;padding:0 14px}
.btn.ghost{background:none;box-shadow:none;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;animation:cardIn .45s var(--ease) both}
.empty{text-align:center;padding:40px 20px;color:var(--mu)}.empty div{font-size:52px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
/* feuilles */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(25,15,8,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.out{animation:fade .22s reverse forwards}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));animation:up .42s var(--ease);position:relative;overscroll-behavior:contain}
.sheet-bg.out .sheet{animation:up .25s reverse forwards}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:3px;background:#DDD3C7;margin:0 auto 12px}
.sheet .close{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--sh);display:grid;place-items:center}
.sheet .close svg{width:18px;height:18px}
.sheet.full{padding-top:0}
.sheet.full .cover{margin:0 -20px;height:300px;border-radius:28px 28px 0 0}
.sheet.full .grab{position:absolute;top:8px;left:50%;margin-left:-21px;z-index:5;background:rgba(255,255,255,.8)}
.cover.ph .emo{font-size:84px}
.dt{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:20px;z-index:3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:16px}.stat small{color:var(--mu);font-size:11.5px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:4px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-size:18px;font-weight:700}.stepper b{min-width:64px;text-align:center;font-size:14px}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing .q{margin-left:auto;color:var(--mu);font-size:14px;font-weight:600;white-space:nowrap}
.ing .st{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:12px}.ing .st.ok{background:var(--ok-soft);color:var(--ok)}
.step{display:flex;gap:14px;padding:12px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;transition:all .25s}
.step .n{width:30px;height:30px;border-radius:10px;background:var(--pri-soft);color:var(--pri);font-weight:800;display:grid;place-items:center;flex:none;transition:all .25s}
.step.done{opacity:.55}.step.done .n{background:var(--ok);color:#fff}.step.done p{text-decoration:line-through}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools span{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600}
.tools span.miss{background:#FDECEA;color:var(--dan);box-shadow:none}
.bar-actions{position:sticky;bottom:calc(-24px - var(--safe-b));margin:18px -20px calc(-24px - var(--safe-b));padding:12px 20px calc(14px + var(--safe-b));background:linear-gradient(180deg,rgba(251,247,241,0),var(--bg) 30%);display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* formulaires */
.lbl{font-weight:700;font-size:14px;margin:18px 0 10px;display:flex;justify-content:space-between}
.inp{width:100%;height:50px;border-radius:14px;border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);padding:0 14px;font-size:16px;outline:0;transition:box-shadow .2s}
.inp:focus{box-shadow:inset 0 0 0 2px var(--pri)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:650;font-size:13.5px;color:var(--mu);transition:all .2s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.switch{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);cursor:pointer}
.switch .t{flex:1}.switch .t small{display:block;color:var(--mu);font-size:12.5px}
.tg{width:50px;height:30px;border-radius:15px;background:#E2D9CE;position:relative;transition:background .25s;flex:none}.tg:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.tg.on{background:var(--ok)}.tg.on:after{transform:translateX(20px)}
/* ustensiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:18px;padding:14px 12px;text-align:left;box-shadow:inset 0 0 0 1.5px var(--line);transition:all .22s var(--ease);position:relative;animation:cardIn .45s var(--ease) both}
.tile .e{font-size:30px;display:block;margin-bottom:6px;transition:transform .3s var(--ease)}
.tile b{display:block;font-size:14.5px}.tile small{color:var(--mu);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.tile.on{box-shadow:inset 0 0 0 2px var(--pri),0 8px 20px rgba(232,97,60,.15);background:#FFF8F5}
.tile.on .e{transform:scale(1.12) rotate(-6deg)}
.tile:after{content:'✓';position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;transform:scale(0);transition:transform .25s var(--ease)}
.tile.on:after{transform:scale(1)}
/* onboarding */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(var(--safe-t) + 24px) 22px calc(30px + var(--safe-b));animation:fade .3s}
.ob .in{max-width:560px;margin:0 auto}
.ob .big{font-size:76px;text-align:center;margin:40px 0 10px;animation:float 3s ease-in-out infinite}
.ob h1{font-size:32px;text-align:center}
.ob p.lead{text-align:center;color:var(--mu);font-size:16px;margin:8px auto 28px;max-width:400px}
.ob .prog{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.ob .prog i{width:26px;height:6px;border-radius:3px;background:#E6DCD0;transition:all .3s}.ob .prog i.on{background:var(--pri);width:40px}
.feat{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:10px;animation:cardIn .5s var(--ease) both}
.feat span{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--pri-soft);display:grid;place-items:center;flex:none}
.foot{position:sticky;bottom:0;padding-top:16px;background:linear-gradient(180deg,rgba(251,247,241,0),var(--bg) 35%)}
/* planning */
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;animation:cardIn .45s var(--ease) both}
.day.today{box-shadow:inset 0 0 0 2px var(--pri),var(--sh)}
.day h4{display:flex;align-items:center;gap:8px;font-size:15.5px;margin-bottom:10px;text-transform:capitalize}.day h4 em{font-style:normal;background:var(--pri);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px;text-transform:none}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border-radius:16px;overflow:hidden;background:var(--soft);min-height:118px;text-align:left;position:relative;transition:transform .15s;display:flex;flex-direction:column}
.slot:active{transform:scale(.97)}
.slot .ph{height:74px}.slot .ph .emo{font-size:30px}
.slot .sn{padding:7px 10px 9px;font-size:12.5px;font-weight:650;line-height:1.25}.slot .sn small{display:block;color:var(--mu);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.slot.empty{border:2px dashed #E3D8CB;background:none;align-items:center;justify-content:center;color:var(--mu);font-size:13px;font-weight:650;gap:2px}
.slot.empty b{font-size:24px;color:#CBBDAE;font-weight:400}
/* liste */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:8px;animation:cardIn .4s var(--ease) both;transition:opacity .3s,transform .3s}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:15px;font-weight:650}.li .t small{color:var(--mu);font-size:12.5px}
.ck{width:26px;height:26px;border-radius:9px;box-shadow:inset 0 0 0 2px #D8CCBE;display:grid;place-items:center;flex:none;transition:all .25s var(--ease)}
.ck.on{background:var(--ok);box-shadow:none;color:#fff}.ck svg{width:16px;height:16px;stroke-width:3;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}.ck.on svg{opacity:1;transform:none}
.li.done .t b{text-decoration:line-through;color:var(--mu)}
.del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#B9AEA2}.del svg{width:18px;height:18px}
.qbtn{width:30px;height:30px;border-radius:9px;background:var(--soft);font-weight:800}
.badge-exp{font-size:11px;font-weight:750;padding:2px 7px;border-radius:7px;margin-left:6px}.badge-exp.u{background:#FDECEA;color:var(--dan)}.badge-exp.s{background:#FFF4DF;color:#B7791F}.badge-exp.k{background:var(--ok-soft);color:var(--ok)}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#56C08E);border-radius:4px;transition:width .6s var(--ease)}
.aisle{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:18px 4px 8px}
.add{display:flex;gap:8px}.add .inp{flex:1}
.addbtn{width:50px;height:50px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}.addbtn:active{transform:scale(.92)}
.scan{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,#2B2420,#433630);color:#fff;cursor:pointer;box-shadow:var(--sh2)}
.scan span{font-size:30px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.scan small{opacity:.75}

.pickrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--card);box-shadow:var(--sh);margin-bottom:8px;width:100%;text-align:left;animation:cardIn .35s var(--ease) both}

.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards;border-radius:2px}

.stats.four{grid-template-columns:repeat(4,1fr)}.stats.four .stat b{font-size:14.5px}

.mi{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.mi:last-child{border:0}
.mi .ck{width:22px;height:22px;border-radius:7px;margin-top:1px}.mi p{font-size:14.5px}
.mi.done .ck{background:var(--ok);box-shadow:none;color:#fff}.mi.done .ck svg{opacity:1;transform:none}.mi.done p{color:var(--mu);text-decoration:line-through}
.step p{font-size:15px;line-height:1.5}
.tmr{margin-top:8px;height:32px;padding:0 12px;border-radius:10px;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px;transition:transform .15s}.tmr:active{transform:scale(.94)}
.step.done .tmr{display:none}
#timers{position:fixed;top:calc(var(--safe-t) + 66px);left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 24px));pointer-events:none}
.tm{pointer-events:auto;display:flex;align-items:center;gap:12px;background:rgba(30,27,24,.94);backdrop-filter:blur(12px);color:#fff;border-radius:18px;padding:10px 10px 10px 12px;box-shadow:var(--sh2);animation:cardIn .4s var(--ease)}
.tm div{flex:1;min-width:0}.tm b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1.1}.tm small{opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.tm.ring{background:var(--pri);animation:ring .6s ease-in-out infinite alternate}

t (20 min).","Béchamel : faire fondre le beurre, ajouter la farine et cuire 1 min en fouettant (roux), puis verser le lait froid petit à petit sans cesser de fouetter.","Cuire la béchamel jusqu'à épaississement (5 min), saler, poivrer, ajouter une pincée de muscade.","Montage : un fond de sauce, une couche de feuilles, de la bolognaise, de la béchamel ; recommencer 3 fois et terminer par béchamel et fromage râpé.","Enfourner à 180 °C jusqu'à ce que le dessus soit bien doré et que la pointe d'un couteau traverse les pâtes facilement (35 min).","Laisser reposer 10 min avant de couper : les parts se tiendront mieux."]},{"p":30,"c":35,"m":["Préchauffer le four à 200 °C","Laver les courgettes et l'aubergine, les couper en tranches de 5 mm dans la longueur","Peser beurre, farine et lait","Huiler un plat à gratin"],"s":["Disposer les légumes sur une plaque, badigeonner d'huile, saler et faire griller au four à 200 °C (15 min) ou à la poêle (3 min par face).","Préparer une béchamel : beurre fondu + farine 1 min, puis lait en fouettant jusqu'à épaississement (5 min). Saler, poivrer, muscade.","Assaisonner les tomates concassées avec sel, poivre et herbes.","Monter : tomate, feuilles de lasagne, légumes, béchamel ; répéter 3 fois, finir par béchamel et fromage.","Baisser le four à 180 °C et cuire jusqu'à ce que le dessus soit gratiné (35 min). Laisser reposer 10 min."]},{"p":10,"c":12,"m":["Porter l'eau à ébullition","Couper mozzarella et gorgonzola en dés","Râper le parmesan et l'emmental"],"s":["Cuire les pâtes al dente dans l'eau bouillante salée (environ 10 min).","Pendant ce temps, chauffer la crème à feu doux dans une grande casserole sans la faire bouillir.","Ajouter les fromages au fur et à mesure en remuant jusqu'à obtenir une sauce lisse (4 à 5 min). Poivrer, saler très peu.","Égoutter les pâtes, les verser dans la sauce et mélanger 1 min à feu doux. Servir aussitôt."]},{"p":10,"c":20,"m":["Porter l'eau à ébullition","Émincer l'ail, hacher les anchois","Dénoyauter et couper les olives en rondelles, égoutter les câpres"],"s":["Dans une poêle, chauffer 3 c. à soupe d'huile d'olive à feu doux, y faire fondre l'ail et les anchois en les écrasant (2 min).","Ajouter les tomates concassées et laisser réduire à feu moyen (10 min).","Incorporer olives et câpres, poivrer et cuire encore 5 min. Saler peu : anchois et câpres sont déjà salés.","Pendant ce temps, cuire les spaghetti al dente (9 à 11 min).","Égoutter, mélanger avec la sauce 1 min dans la poêle et servir avec du persil haché."]},{"p":10,"c":15,"m":["Porter l'eau à ébullition","Laver les courgettes et les tailler en demi-rondelles fines","Émincer l'ail, râper le parmesan"],"s":["Cuire les pâtes al dente dans l'eau bouillante salée (environ 10 min).","Chauffer l'huile d'olive dans une grande poêle à feu vif, ajouter les courgettes et les faire dorer sans trop remuer (6 à 8 min).","Ajouter l'ail, saler, poivrer et cuire encore 1 min.","Verser les pâtes égouttées et une demi-louche d'eau de cuisson, mélanger avec le parmesan jusqu'à ce que ce soit crémeux."]},{"p":10,"c":15,"m":["Porter l'eau à ébullition","Nettoyer les champignons avec un papier humide et les émincer","Hacher l'ail et le persil"],"s":["Cuire les pâtes al dente (environ 10 min).","Dans une poêle bien chaude avec un filet d'huile, saisir les champignons sans sel jusqu'à ce que leur eau s'évapore et qu'ils dorent (8 min).","Ajouter l'ail (1 min), saler, poivrer, puis verser la crème et laisser frémir 3 min.","Mélanger avec les pâtes égouttées, parsemer de persil."]},{"p":5,"c":12,"m":["Porter l'eau à ébullition","Peler et émincer finement l'ail","Hacher le persil"],"s":["Cuire les spaghetti al dente dans l'eau bouillante salée (9 à 11 min).","3 min avant la fin, chauffer l'huile d'olive à feu doux avec l'ail et le piment : l'ail doit juste blondir, jamais brunir (2 à 3 min).","Ajouter une louche d'eau de cuisson dans la poêle pour lier l'huile.","Égoutter les pâtes, les verser dans la poêle et mélanger vivement à feu moyen 1 min jusqu'à ce que la sauce nappe.","Ajouter le persil et servir."]},{"p":5,"c":20,"m":["Porter l'eau à ébullition","Émincer l'ail"],"s":["Chauffer l'huile d'olive à feu doux, faire revenir l'ail et le piment 1 min.","Ajouter les tomates, saler, et laisser réduire à feu moyen jusqu'à ce que la sauce épaississe (12 à 15 min).","Pendant ce temps, cuire les penne al dente (11 à 13 min).","Égoutter, mélanger avec la sauce à feu vif 1 min et servir avec du persil."]},{"p":10,"c":12,"m":["Porter l'eau à ébullition","Couper le saumon fumé en lanières","Zester puis presser le citron","Hacher l'aneth"],"s":["Cuire les tagliatelles al dente (6 à 10 min).","Chauffer doucement la crème avec le zeste de citron, poivrer (3 min) sans faire bouillir.","Hors du feu, ajouter un filet de jus de citron et l'aneth.","Égoutter les pâtes, les mélanger à la crème puis ajouter le saumon fumé au dernier moment pour qu'il ne cuise pas."]},{"p":10,"c":25,"m":["Préchauffer le four à 200 °C (grill)","Porter l'eau à ébullition","Peser beurre, farine, lait ; râper le fromage"],"s":["Cuire les macaroni 2 min de moins que le temps indiqué (ils finiront au four).","Béchamel : faire fondre le beurre, ajouter la farine et fouetter 1 min, verser le lait froid peu à peu, cuire jusqu'à épaississement (5 min).","Hors du feu, incorporer les deux tiers du fromage, saler, poivrer, muscade.","Mélanger avec les macaroni égouttés, verser dans un plat beurré, couvrir du reste de fromage.","Gratiner au four jusqu'à ce que le dessus soit doré et bouillonnant (12 à 15 min)."]},{"p":10,"c":15,"m":["Porter l'eau à ébullition","Ciseler l'oignon, hacher l'ail","Égoutter le thon et l'émietter"],"s":["Faire revenir l'oignon dans 2 c. à soupe d'huile d'olive (4 min), puis l'ail (1 min).","Ajouter les tomates, sel, poivre, et laisser mijoter (10 min).","Cuire les pâtes al dente (environ 10 min).","Ajouter le thon à la sauce 2 min avant la fin juste pour le réchauffer, puis mélanger avec les pâtes égouttées."]},{"p":10,"c":8,"m":["Éplucher les carottes et les tailler en julienne (fins bâtonnets)","Émincer le chou finement","Préparer la sauce : soja + huile de sésame"],"s":["Cuire les nouilles selon le paquet (3 à 4 min), les égoutter et les rincer à l'eau froide.","Chauffer un wok ou une grande poêle à feu très vif avec 1 c. à soupe d'huile neutre.","Sauter carottes et chou en remuant sans arrêt (3 min) : ils doivent rester croquants.","Ajouter les nouilles et la sauce, sauter encore 2 min. Servir aussitôt."]},{"p":15,"c":12,"m":["Porter l'eau à ébullition","Couper courgette et carotte en petits dés","Râper le parmesan"],"s":["Cuire les pâtes al dente (environ 10 min) ; ajouter les petits pois et les dés de carotte dans l'eau 4 min avant la fin.","Pendant ce temps, faire sauter la courgette dans un filet d'huile (4 min).","Égoutter pâtes et légumes, les verser dans la poêle avec la crème, saler, poivrer.","Chauffer 2 min, ajouter le parmesan et servir."]},{"p":10,"c":10,"m":["Laver les épinards et retirer les grosses tiges","Râper le parmesan","Porter une grande casserole d'eau salée à frémissement"],"s":["Faire tomber les épinards dans une poêle avec une noix de beurre (2 min), les presser pour retirer l'eau.","Mélanger épinards, ricotta, la moitié du parmesan, sel, poivre et muscade (sert de sauce ou de garniture si raviolis frais maison).","Cuire les raviolis dans l'eau frémissante, pas bouillante, pour qu'ils n'éclatent pas (3 à 4 min, ils remontent à la surface).","Faire fondre le reste du beurre jusqu'à couleur noisette (2 min).","Égoutter les raviolis, les napper de beurre noisette et de crème ricotta-épinards, parsemer de parmesan."]},{"p":10,"c":15,"m":["Porter l'eau à ébullition","Râper les courgettes en gros ou les couper en fins bâtonnets","Battre œufs + parmesan râpé + poivre"],"s":["Cuire les pâtes al dente (environ 10 min).","Faire dorer les courgettes dans un filet d'huile à feu vif (5 min), saler.","Égoutter les pâtes en gardant une louche d'eau, les verser dans la poêle hors du feu.","Ajouter le mélange œufs-parmesan en remuant vite, détendre avec l'eau de cuisson pour obtenir une sauce crémeuse."]},{"p":10,"c":12,"m":["Utiliser du riz cuit la veille et froid (idéal), sinon le cuire et l'étaler pour qu'il refroidisse","Couper les carottes en petits dés","Battre les œufs"],"s":["Si besoin, cuire le riz : rincer, puis cuire dans 1,5 fois son volume d'eau, couvert, à feu doux (12 min). Étaler et laisser refroidir.","Dans un wok très chaud avec 1 c. à soupe d'huile, cuire les œufs en omelette brouillée (1 min), réserver.","Sauter carottes et petits pois (4 min).","Ajouter le riz froid, le sauter à feu vif en l'égrainant (4 min).","Ajouter les œufs et la sauce soja, mélanger 1 min et servir."]},{"p":10,"c":25,"m":["Faire chauffer le bouillon et le garder frémissant","Ciseler une échalote ou un oignon (facultatif)","Émincer les champignons, râper le parmesan, couper le beurre en dés et le garder au frais"],"s":["Saisir les champignons dans une poêle chaude avec un filet d'huile (6 min), saler, réserver.","Dans une sauteuse, faire suer l'oignon dans un peu de beurre (3 min), ajouter le riz et le nacrer en remuant jusqu'à ce qu'il soit translucide (2 min).","Verser le vin blanc et laisser évaporer en remuant (1 min).","Ajouter le bouillon chaud louche par louche, en attendant qu'il soit absorbé avant d'ajouter la suivante, en remuant souvent (17 à 18 min).","Incorporer les champignons 2 min avant la fin. Le riz doit être tendre avec un léger croquant.","Hors du feu, ajouter le beurre froid et le parmesan, remuer vivement (mantecatura), couvrir 1 min et servir."]},{"p":15,"c":25,"m":["Décortiquer les crevettes et retirer le boyau noir","Hacher l'ail, râper le parmesan","Chauffer le bouillon et le garder frémissant"],"s":["Saisir les crevettes avec la moitié de l'ail dans un filet d'huile (2 min), réserver.","Faire revenir le reste de l'ail dans un peu d'huile, ajouter le riz et le nacrer (2 min).","Déglacer au vin blanc (1 min), puis ajouter le bouillon louche par louche en remuant (17 à 18 min).","Remettre les crevettes 1 min avant la fin pour les réchauffer sans les durcir.","Hors du feu, incorporer le parmesan et une noix de beurre, laisser reposer 1 min."]},{"p":10,"c":20,"m":["Couper le poulet en dés de 2 cm","Ciseler l'oignon","Rincer le riz"],"s":["Cuire le riz dans 1,5 fois son volume d'eau salée, à couvert et à feu doux (12 min), puis laisser reposer 5 min hors du feu.","Dans une sauteuse, faire revenir l'oignon dans 1 c. à soupe d'huile (4 min).","Ajouter le poulet et le faire dorer (5 min), puis le curry et remuer 30 s pour torréfier les épices.","Verser le lait de coco, saler, et laisser mijoter à feu doux (10 min).","Servir le curry sur le riz."]},{"p":10,"c":15,"m":["Cuire le riz la veille, ou le cuire et l'étaler pour qu'il refroidisse","Battre les œufs","Couper les lardons en petits morceaux (ou dés de jambon)"],"s":["Cuire les œufs battus en fine omelette dans une poêle huilée (2 min), la rouler et la couper en lanières.","Faire dorer les lardons à sec dans le wok (4 min), ajouter les petits pois (3 min).","Ajouter le riz froid et le sauter à feu vif en l'égrainant (4 min).","Assaisonner de sauce soja, ajouter l'omelette, mélanger et servir."]},{"p":20,"c":40,"m":["Couper le poulet en morceaux, décortiquer les crevettes (garder quelques-unes entières pour le décor)","Gratter et laver les moules, jeter celles qui sont ouvertes","Couper le poivron en lanières","Faire infuser le safran dans 1,2 L de bouillon chaud"],"s":["Dans une grande poêle à paella, dorer le poulet dans 3 c. à soupe d'huile d'olive (8 min), ajouter le poivron (4 min).","Ajouter le riz et le nacrer 2 min, puis verser le bouillon safrané. Saler.","Cuire à feu moyen sans remuer (10 min).","Répartir crevettes, moules et petits pois en les enfonçant dans le riz, et poursuivre à feu doux (10 min) jusqu'à absorption du bouillon.","Couvrir d'un torchon et laisser reposer 5 min hors du feu. Servir avec des quartiers de citron."]},{"p":5,"c":20,"m":["Ciseler l'oignon","Chauffer le bouillon"],"s":["Faire fondre le beurre dans une casserole, faire suer l'oignon sans coloration (3 min).","Ajouter le riz sec et le nacrer en remuant jusqu'à ce qu'il soit translucide (2 min).","Verser le bouillon chaud, porter à ébullition, couvrir et cuire à feu très doux sans soulever le couvercle (15 min).","Laisser reposer 5 min à couvert, puis égrainer à la fourchette."]},{"p":10,"c":25,"m":["Rincer et égoutter les haricots rouges","Ciseler l'oignon, hacher l'ail","Rincer le riz"],"s":["Cuire le riz dans 1,5 fois son volume d'eau salée, couvert, à feu doux (12 min), laisser reposer 5 min.","Faire revenir l'oignon dans un filet d'huile (4 min), ajouter l'ail et le cumin (1 min).","Ajouter tomates et haricots, saler, poivrer, et mijoter (10 min).","Mélanger avec le riz ou servir à côté."]},{"p":5,"c":20,"m":["Ciseler l'oignon","Chauffer le bouillon"],"s":["Faire revenir l'oignon dans l'huile d'olive (4 min), ajouter le riz et le nacrer (2 min).","Ajouter les tomates et le bouillon chaud, saler, porter à ébullition.","Couvrir et cuire à feu doux sans remuer (15 min).","Laisser reposer 5 min et égrainer."]},{"p":5,"c":18,"m":["Chauffer le bouillon","Laver, sécher et ciseler persil et ciboulette"],"s":["Nacrer le riz dans la moitié du beurre (2 min).","Verser le bouillon chaud, couvrir et cuire à feu doux (15 min).","Hors du feu, ajouter le reste du beurre et les herbes, mélanger délicatement à la fourchette."]},{"p":15,"c":15,"m":["Cuire le riz à l'avance et le laisser refroidir","Couper le poulet en dés, l'ananas en morceaux, le poivron en carrés"],"s":["Dans un wok chaud huilé, saisir le poulet jusqu'à ce qu'il soit doré et cuit (6 min).","Ajouter le poivron (3 min) puis l'ananas (2 min).","Ajouter le riz froid, sauter à feu vif (4 min) et assaisonner de sauce soja."]},{"p":10,"c":25,"m":["Ciseler l'oignon, couper le poivron en dés","Rincer le riz"],"s":["Faire dorer les lardons à sec (4 min), ajouter oignon et poivron (5 min).","Ajouter le curry (30 s) puis le riz et le nacrer (2 min).","Verser les tomates et 50 cl d'eau, saler, couvrir et cuire à feu doux (15 min).","Laisser reposer 5 min à couvert avant de servir."]},{"p":10,"c":22,"m":["Chauffer le bouillon et le garder frémissant","Ciseler l'oignon, râper le parmesan","Couper le beurre en dés et le garder au frais"],"s":["Faire suer l'oignon dans 20 g de beurre (3 min), ajouter le riz et le nacrer (2 min).","Déglacer au vin blanc (1 min).","Ajouter le bouillon louche par louche en remuant souvent (17 à 18 min).","Hors du feu, incorporer le beurre froid et le parmesan en remuant vivement, couvrir 1 min. Le risotto doit être crémeux et onduler dans l'assiette."]},{"p":5,"c":20,"m":["Faire infuser le safran dans le bouillon chaud 10 min","Ciseler l'oignon"],"s":["Faire suer l'oignon dans l'huile d'olive (3 min), ajouter le riz et le nacrer (2 min).","Verser le bouillon safrané, saler, couvrir et cuire à feu doux (15 min).","Laisser reposer 5 min et égrainer."]},{"p":5,"c":20,"m":["Rincer le riz jusqu'à ce que l'eau soit claire","Bien secouer la boîte de lait de coco"],"s":["Dans une casserole, mélanger riz, lait de coco, eau, sucre et sel.","Porter à frémissement en remuant (le lait de coco attache facilement), puis couvrir.","Cuire à feu très doux (15 min), puis laisser reposer 10 min à couvert hors du feu."]},{"p":20,"c":75,"m":["Sortir le poulet 30 min avant pour qu'il soit à température ambiante","Préchauffer le four à 200 °C","Éplucher et couper les pommes de terre et les carottes en gros morceaux, l'oignon en quartiers"],"s":["Mettre les légumes dans un grand plat, arroser d'huile, saler, poivrer, parsemer de thym.","Frotter le poulet d'huile, de sel et de poivre, le poser sur les légumes, cuisses vers le haut.","Enfourner à 200 °C (1 h 15 environ pour un poulet de 1,5 kg), en arrosant avec le jus toutes les 20 min.","Vérifier la cuisson : en piquant la cuisse, le jus doit être clair (75 °C à cœur).","Laisser reposer le poulet 10 min sous une feuille d'aluminium avant de le découper."]},{"p":15,"c":25,"m":["Éplucher les pommes de terre, les tailler en frites de 1 cm, les rincer et bien les sécher","Sortir les steaks 15 min avant"],"s":["Première cuisson : plonger les frites dans l'huile à 150 °C jusqu'à ce qu'elles soient tendres mais pâles (6 à 7 min). Égoutter.","Monter l'huile à 180 °C et replonger les frites jusqu'à ce qu'elles soient dorées et croustillantes (2 à 3 min). Égoutter sur papier absorbant et saler.","Cuire les steaks dans une poêle très chaude avec un filet d'huile : 2 min par face pour saignant, 3 min pour à point.","Saler, poivrer et servir aussitôt avec les frites."]},{"p":15,"c":45,"m":["Couper les poivrons en lanières","Émincer l'oignon, hacher l'ail"],"s":["Saler les cuisses et les dorer sur toutes les faces dans une cocotte avec 2 c. à soupe d'huile (8 min), réserver.","Dans la même cocotte, faire fondre oignon et poivrons (8 min), ajouter l'ail et le piment (1 min).","Ajouter les tomates, remettre le poulet, couvrir et mijoter à feu doux (30 min).","Rectifier l'assaisonnement et servir avec du riz."]},{"p":30,"c":180,"m":["La veille (idéal) : couper le bœuf en cubes de 5 cm et le faire mariner au frais dans le vin avec les carottes en rondelles et un oignon","Égoutter la viande et la sécher, garder la marinade","Émincer les oignons, nettoyer les champignons"],"s":["Dans une cocotte, faire dorer les lardons (5 min), réserver.","Saisir la viande par petites quantités dans l'huile chaude jusqu'à ce qu'elle soit bien brune (10 min en tout).","Ajouter les oignons (5 min), saupoudrer de farine et remuer 1 min.","Verser la marinade (vin et carottes), ajouter un bouquet garni, porter à ébullition, couvrir.","Laisser mijoter à feu très doux (2 h 30) : la viande doit se couper à la cuillère.","Faire sauter les champignons au beurre (6 min), les ajouter avec les lardons 15 min avant la fin. Servir avec des pâtes ou des pommes vapeur."]},{"p":20,"c":90,"m":["Couper le veau en morceaux de 5 cm (épaule ou tendron)","Éplucher carottes et oignons","Nettoyer et émincer les champignons"],"s":["Mettre la viande dans une cocotte, couvrir d'eau froide, porter à ébullition et écumer (5 min).","Ajouter carottes en tronçons, oignons, bouquet garni, sel ; couvrir et cuire à frémissement (1 h 15).","Faire revenir les champignons au beurre (6 min).","Filtrer et garder 75 cl de bouillon. Sauce : beurre + farine 1 min, puis bouillon en fouettant ; cuire jusqu'à épaississement (8 min).","Ajouter la crème hors du feu, puis la viande, les carottes et les champignons. Réchauffer sans faire bouillir et servir avec du riz."]},{"p":10,"c":25,"m":["Couper le poulet en dés","Ciseler l'oignon, hacher l'ail, râper le gingembre"],"s":["Faire revenir l'oignon dans 2 c. à soupe d'huile (5 min), ajouter ail et gingembre (1 min).","Ajouter le curry et le faire griller 30 s en remuant.","Ajouter le poulet et le faire colorer (5 min).","Verser le lait de coco, saler, et mijoter à feu doux (15 min). Servir avec du riz basmati."]},{"p":10,"c":20,"m":["Aplatir légèrement les filets pour une épaisseur régulière","Zester un citron, presser les deux","Émincer l'ail"],"s":["Mélanger jus, zeste, ail, thym et huile ; y mariner le poulet 15 min (ou plus au frais).","Égoutter et cuire le poulet dans une poêle chaude (5 à 6 min par face) jusqu'à ce qu'il soit doré et cuit à cœur.","Verser la marinade dans la poêle, laisser réduire 2 min et napper le poulet."]},{"p":15,"c":10,"m":["Aplatir les escalopes à 5 mm entre deux films","Préparer 3 assiettes : farine salée / œufs battus / chapelure"],"s":["Paner : passer chaque escalope dans la farine, tapoter, puis dans l'œuf, puis dans la chapelure en appuyant.","Chauffer 1 cm d'huile dans une grande poêle (170 °C : un morceau de pain y grésille aussitôt).","Cuire jusqu'à ce que la panure soit dorée (2 à 3 min par face).","Égoutter sur papier absorbant, saler et servir avec un quartier de citron."]},{"p":10,"c":8,"m":["Sortir les côtelettes 20 min avant","Hacher l'ail, effeuiller le romarin"],"s":["Frotter les côtelettes avec huile, ail et romarin.","Les saisir dans une poêle très chaude (2 à 3 min par face pour rosé).","Saler, poivrer et laisser reposer 3 min avant de servir."]},{"p":20,"c":75,"m":["Préchauffer le four à 180 °C","Sortir le rôti 30 min avant","Éplucher les pommes de terre et les couper en quartiers"],"s":["Piquer le rôti de gousses d'ail, le frotter d'huile, de thym, sel et poivre.","Le dorer sur toutes les faces dans une cocotte (8 min).","Disposer les pommes de terre autour, ajouter 10 cl d'eau, et enfourner à 180 °C (1 h 15) en arrosant régulièrement.","Vérifier la cuisson : 70 °C à cœur. Laisser reposer 10 min avant de trancher."]},{"p":15,"c":75,"m":["Rincer la choucroute si elle est très acide, bien l'égoutter","Éplucher les pommes de terre (les laisser entières si petites)"],"s":["Dans une grande cocotte, faire revenir les lardons (5 min).","Ajouter la choucroute, le vin blanc, 20 cl d'eau, poivre et baies de genièvre si vous en avez. Couvrir et cuire à feu doux (45 min).","Ajouter les pommes de terre et les saucisses, poursuivre (30 min).","Servir bien chaud avec de la moutarde."]},{"p":30,"c":180,"m":["La veille : faire tremper les haricots secs dans un grand volume d'eau froide (12 h)","Hacher l'ail, couper les saucisses en tronçons","Préchauffer le four à 150 °C"],"s":["Égoutter les haricots, les couvrir d'eau froide, porter à ébullition et cuire à frémissement (1 h), sans saler. Égoutter en gardant le bouillon.","Dorer les lardons et les saucisses dans la graisse du confit (8 min), ajouter l'ail (1 min).","Dans une cocotte en terre, alterner haricots, viandes et tomates, couvrir de bouillon. Poser les cuisses de canard dessus.","Enfourner à 150 °C (2 h). Toutes les 30 min, casser la croûte qui se forme et l'enfoncer ; ajouter du bouillon si ça sèche.","Laisser reposer 15 min avant de servir."]},{"p":10,"c":45,"m":["Ciseler l'oignon","Rincer et égoutter les haricots rouges"],"s":["Faire revenir l'oignon dans 2 c. à soupe d'huile (5 min).","Ajouter le bœuf et le faire dorer en l'émiettant (8 min).","Ajouter cumin et piment (1 min), puis les tomates et 15 cl d'eau. Saler, poivrer.","Mijoter à feu doux à couvert (25 min), ajouter les haricots et cuire encore 10 min.","Servir avec du riz, de la crème fraîche et de la coriandre."]},{"p":15,"c":15,"m":["Couper les tomates en dés, émincer la salade et l'oignon","Préparer le fromage râpé dans un bol"],"s":["Faire dorer le bœuf avec l'oignon dans un filet d'huile (8 min), saler, poivrer, ajouter cumin et paprika (1 min).","Réchauffer les tortillas 20 s par face dans une poêle sèche, les garder dans un torchon.","Garnir chaque tortilla de viande, salade, tomate et fromage. Servir aussitôt."]},{"p":15,"c":10,"m":["Couper la tomate en rondelles, l'oignon en fines rondelles","Laver la salade","Façonner les steaks si viande hachée en vrac (un peu plus larges que le pain)"],"s":["Toaster les pains côté mie dans une poêle sèche (1 min), réserver.","Cuire les steaks dans une poêle très chaude (2 à 3 min par face), saler, poivrer.","1 min avant la fin, poser le cheddar sur la viande et couvrir pour le faire fondre.","Monter : pain, sauce, salade, steak au cheddar, tomate, oignon, pain."]},{"p":10,"c":20,"m":["Couper le poulet en morceaux","Hacher l'ail, râper le gingembre","Mélanger miel + sauce soja + ail + gingembre"],"s":["Faire dorer le poulet dans 1 c. à soupe d'huile à feu vif (6 à 8 min).","Verser la sauce, baisser le feu et laisser réduire en enrobant le poulet jusqu'à ce qu'elle soit sirupeuse et laquée (8 à 10 min).","Parsemer de sésame et servir avec du riz."]},{"p":15,"c":15,"m":["Aplatir les filets à 1,5 cm d'épaisseur","Préparer farine / œufs battus / panko dans 3 assiettes"],"s":["Saler et poivrer le poulet, puis le paner : farine, œuf, panko en appuyant bien.","Chauffer 1,5 cm d'huile à 170 °C dans une poêle.","Cuire jusqu'à ce que la panure soit dorée et le poulet cuit à cœur (4 à 5 min par face).","Égoutter sur une grille, laisser reposer 2 min et trancher. Servir avec du riz et de la sauce tonkatsu."]},{"p":20,"c":15,"m":["Couper le poulet en cubes de 3 cm","Couper poivrons et oignon en carrés","Faire tremper les piques en bois 30 min dans l'eau"],"s":["Mariner le poulet avec huile, paprika, sel et poivre (au moins 20 min).","Monter les brochettes en alternant poulet, poivron et oignon.","Cuire dans une poêle-gril ou au four sous le grill en les retournant (12 à 15 min) jusqu'à ce que le poulet soit doré et cuit à cœur."]},{"p":15,"c":12,"m":["Couper le porc en fines lanières","Couper poivron et carottes en bâtonnets","Mélanger sauce soja + miel"],"s":["Saisir le porc dans un wok très chaud et huilé (4 min), réserver.","Sauter les légumes (4 min) : ils doivent rester croquants.","Remettre le porc, ajouter la sauce et sauter 2 min jusqu'à ce qu'elle enrobe. Servir avec du riz."]},{"p":15,"c":45,"m":["Préchauffer le four à 200 °C","Couper les pommes de terre en quartiers (sans les éplucher si peau fine)","Écraser les gousses d'ail en chemise"],"s":["Mettre pommes de terre et ail dans un plat, huiler, saler, ajouter le thym.","Poser les cuisses dessus, peau vers le haut, saler, poivrer, huiler.","Enfourner à 200 °C (45 min) jusqu'à ce que la peau soit croustillante et le jus clair."]},{"p":15,"c":25,"m":["Entailler le poulet en morceaux","Mélanger yaourt, épices, jus de citron, ail râpé et sel","Mariner au moins 1 h au frais (idéalement une nuit)"],"s":["Préchauffer le four à 220 °C.","Disposer le poulet sur une plaque recouverte de papier cuisson.","Cuire (20 à 25 min), puis 3 min sous le grill pour colorer.","Servir avec riz basmati, naan et rondelles d'oignon."]},{"p":20,"c":25,"m":["Mélanger viande, chapelure, œuf, parmesan, sel et poivre","Former des boulettes de 3 cm avec les mains humides"],"s":["Dorer les boulettes dans une sauteuse huilée sur toutes les faces (6 min), réserver.","Dans la même sauteuse, faire revenir l'ail (1 min), ajouter les tomates, saler, poivrer.","Remettre les boulettes, couvrir et mijoter à feu doux (15 min).","Servir avec des pâtes ou du pain."]},{"p":5,"c":10,"m":["Sortir les steaks 30 min avant","Les sécher avec du papier absorbant","Écraser l'ail"],"s":["Chauffer une poêle épaisse jusqu'à ce qu'elle fume légèrement, ajouter un filet d'huile.","Saisir les steaks sans les bouger (2 min par face pour saignant, 3 min pour à point).","Ajouter beurre, ail et thym, arroser la viande du beurre moussant (1 min).","Laisser reposer 3 min sur une planche, saler, poivrer, servir."]},{"p":10,"c":15,"m":["Sortir les magrets 20 min avant","Quadriller la peau au couteau sans entailler la chair"],"s":["Poser les magrets côté peau dans une poêle froide, puis allumer à feu moyen : la graisse fond doucement (8 min). Retirer la graisse en cours de cuisson.","Retourner et cuire côté chair (4 min pour rosé).","Hors du feu, badigeonner de miel, saler et poivrer.","Laisser reposer 5 min sous aluminium, puis trancher en biais."]},{"p":10,"c":20,"m":["Éplucher et couper les pommes de terre en dés de 1,5 cm","Hacher l'ail et du persil"],"s":["Réchauffer les cuisses dans une poêle côté peau, à feu moyen (10 min), puis 5 min de l'autre côté. Garder la graisse.","Faire dorer les pommes de terre dans 3 c. à soupe de graisse de canard (15 à 20 min) en remuant.","Ajouter ail et persil 2 min avant la fin, saler. Servir avec les cuisses bien croustillantes."]},{"p":25,"c":50,"m":["La veille ou 2 h avant : émincer les oignons, presser les citrons, écraser l'ail","Mariner le poulet avec citron, oignons, moutarde, ail, sel et poivre"],"s":["Égoutter le poulet et le dorer dans une cocotte huilée (8 min), réserver.","Faire fondre les oignons de la marinade à feu moyen jusqu'à ce qu'ils soient tendres et blonds (15 min).","Remettre le poulet, ajouter le jus de la marinade et 10 cl d'eau, couvrir et mijoter (30 min).","Servir avec du riz blanc."]},{"p":15,"c":45,"m":["Ciseler l'oignon, hacher l'ail","Émincer les champignons"],"s":["Dorer le poulet dans l'huile d'olive (8 min), réserver.","Faire revenir oignon et ail (4 min), déglacer au vin blanc (2 min).","Ajouter tomates et champignons, remettre le poulet, couvrir et mijoter (35 min).","Rectifier l'assaisonnement, parsemer de persil."]},{"p":15,"c":15,"m":["Couper le bœuf (rumsteck) en fines lanières","Émincer l'oignon et les champignons"],"s":["Saisir la viande à feu très vif par petites quantités (2 min), réserver.","Faire revenir l'oignon (4 min) puis les champignons (5 min).","Ajouter crème et moutarde, laisser épaissir 2 min, remettre le bœuf juste pour le réchauffer (1 min).","Servir avec du riz ou des tagliatelles."]},{"p":10,"c":40,"m":["Ciseler l'oignon","Chauffer le bouillon"],"s":["Saler les cuisses et les dorer dans une cocotte huilée (8 min), réserver.","Faire fondre l'oignon (5 min), ajouter le paprika hors du feu (il brûle vite) et mélanger.","Verser le bouillon, remettre le poulet, couvrir et mijoter (25 min).","Retirer le poulet, ajouter la crème à la sauce et réduire 3 min. Napper et servir avec des nouilles ou du riz."]},{"p":5,"c":10,"m":["Sortir le saumon 15 min avant, le sécher avec du papier absorbant","Couper le citron en quartiers, ciseler l'aneth"],"s":["Badigeonner les pavés d'huile, saler et poivrer.","Les poser côté peau dans une poêle bien chaude et cuire sans les bouger jusqu'à ce que la peau soit croustillante et que la chair devienne opaque aux deux tiers (5 à 6 min).","Retourner et cuire 1 à 2 min : le cœur doit rester légèrement nacré.","Parsemer d'aneth et servir avec le citron."]},{"p":10,"c":18,"m":["Préchauffer le four à 200 °C","Couper les tomates cerises en deux, émincer l'ail","Sécher les filets de cabillaud"],"s":["Disposer les tomates et l'ail dans un plat, arroser de la moitié de l'huile, saler.","Poser les filets dessus, saler, poivrer, parsemer de thym et arroser du reste d'huile.","Enfourner à 200 °C jusqu'à ce que la chair s'effeuille facilement à la fourchette (15 à 18 min selon l'épaisseur)."]},{"p":15,"c":15,"m":["Préchauffer le four à 200 °C","Couper les courgettes en fines rondelles, le citron en rondelles","Préparer 4 grandes feuilles de papier cuisson"],"s":["Sur chaque feuille, déposer un lit de courgettes, un pavé de saumon, sel, poivre, aneth, rondelles de citron et un filet d'huile.","Fermer hermétiquement les papillotes en repliant les bords plusieurs fois.","Enfourner à 200 °C (15 min). La papillote gonfle : l'ouvrir à table pour profiter du parfum."]},{"p":5,"c":5,"m":["Sortir les steaks de thon 15 min avant","Presser le citron"],"s":["Badigeonner le thon d'huile, saler, poivrer.","Le saisir dans une poêle très chaude (1 à 2 min par face) : le centre doit rester rose.","Arroser de citron et d'un filet d'huile, servir aussitôt."]},{"p":10,"c":5,"m":["Décortiquer les crevettes en gardant la queue, retirer le boyau","Émincer l'ail, hacher le persil"],"s":["Chauffer l'huile d'olive avec l'ail et le piment à feu moyen jusqu'à ce que l'ail grésille (1 min).","Monter le feu, ajouter les crevettes, saler et cuire jusqu'à ce qu'elles soient roses et opaques (2 min par face).","Ajouter le persil, servir aussitôt avec du pain."]},{"p":20,"c":10,"m":["Gratter et laver les moules ; jeter celles qui sont cassées ou restent ouvertes quand on les tapote","Ciseler les échalotes, hacher le persil"],"s":["Dans un grand faitout, faire fondre le beurre et faire suer les échalotes (3 min).","Verser le vin blanc, porter à ébullition (1 min).","Ajouter les moules, couvrir et cuire à feu vif en secouant la cocotte (5 à 6 min) jusqu'à ce qu'elles soient toutes ouvertes.","Poivrer, ajouter le persil, mélanger et servir avec le jus. Jeter les moules restées fermées."]},{"p":10,"c":10,"m":["Faire préparer les soles par le poissonnier (vidées, peau noire retirée)","Mettre la farine dans une assiette, hacher le persil, presser le citron"],"s":["Saler et poivrer les soles, les fariner et tapoter pour retirer l'excédent.","Cuire dans une poêle avec un filet d'huile et 30 g de beurre à feu moyen (4 min par face) jusqu'à ce qu'elles soient dorées.","Dresser, puis faire fondre le reste du beurre dans la poêle jusqu'à couleur noisette (1 à 2 min), ajouter le jus de citron et le persil.","Napper les soles de ce beurre et servir aussitôt."]},{"p":15,"c":30,"m":["Préchauffer le four à 200 °C","Faire écailler et vider le bar par le poissonnier","Émincer finement le fenouil, couper les tomates en deux, le citron en rondelles"],"s":["Disposer le fenouil dans un plat, arroser d'huile, saler et enfourner 10 min pour le précuire.","Glisser des rondelles de citron dans le ventre du bar, saler, poivrer, huiler.","Le poser sur le fenouil, ajouter les tomates et enfourner jusqu'à ce que la chair se détache de l'arête (20 à 25 min)."]},{"p":10,"c":6,"m":["Faire vider les sardines (ou le faire en pressant le ventre), les rincer et bien les sécher","Couper les citrons en quartiers, hacher le persil"],"s":["Badigeonner les sardines d'huile et les saler au gros sel.","Les cuire dans une poêle-gril ou sous le grill du four très chaud (2 à 3 min par face) jusqu'à ce que la peau soit grillée.","Servir avec le persil, le citron et un filet d'huile."]},{"p":15,"c":0,"m":["Utiliser un saumon très frais (qualité sashimi), ou congelé 7 jours au préalable pour plus de sécurité","Retirer la peau et les arêtes","Presser les citrons, ciseler l'aneth"],"s":["Couper le saumon en tranches très fines avec un couteau bien aiguisé.","Les étaler dans un plat, arroser de jus de citron, saler, poivrer et parsemer d'aneth.","Filmer et laisser mariner au frais (10 min) : la chair devient opaque.","Ajouter l'huile d'olive au moment de servir."]},{"p":10,"c":15,"m":["Décortiquer les crevettes","Ciseler l'oignon, hacher l'ail"],"s":["Faire revenir l'oignon dans un filet d'huile (4 min), ajouter l'ail (1 min).","Ajouter le curry et le faire griller 30 s, puis le lait de coco ; saler et mijoter (6 min).","Ajouter les crevettes et cuire jusqu'à ce qu'elles soient roses (3 min). Servir avec du riz."]},{"p":10,"c":15,"m":["Préchauffer le four à 200 °C","Couper la courgette en fines rondelles, les citrons en rondelles","Préparer 4 feuilles de papier cuisson"],"s":["Sur chaque feuille : courgette, filet de cabillaud, sel, poivre, thym, citron et huile.","Fermer hermétiquement et enfourner à 200 °C (12 à 15 min)."]},{"p":15,"c":25,"m":["Préchauffer le four à 200 °C","Couper le poisson en gros morceaux, retirer les arêtes","Peser beurre, farine, lait ; râper le fromage"],"s":["Pocher le poisson dans le lait frémissant (5 min), l'égoutter et garder le lait.","Béchamel : beurre fondu + farine 1 min, puis le lait de pochage en fouettant jusqu'à épaississement (5 min). Saler, poivrer.","Mettre le poisson dans un plat beurré, napper de béchamel, couvrir de fromage.","Gratiner au four à 200 °C jusqu'à ce que ce soit doré (15 min)."]},{"p":15,"c":8,"m":["Couper le poisson en bâtonnets ou en portions, le sécher","Préparer farine / œufs battus / chapelure dans 3 assiettes"],"s":["Saler le poisson puis le paner : farine, œuf, chapelure.","Chauffer 1 cm d'huile à 170 °C dans une poêle.","Cuire jusqu'à ce que la panure soit dorée (2 à 3 min par face). Égoutter sur papier absorbant et servir avec citron et sauce tartare."]},{"p":15,"c":0,"m":["Utiliser un saumon extra-frais de qualité sashimi, garder tout au frais jusqu'au dernier moment","Ciseler finement l'échalote et la ciboulette, presser le citron"],"s":["Retirer peau et arêtes, couper le saumon en petits dés de 5 mm avec un couteau bien aiguisé.","Mélanger avec échalote, ciboulette, huile, jus de citron, sel et poivre.","Dresser dans un cercle et servir immédiatement (le citron « cuit » le poisson s'il attend trop)."]},{"p":20,"c":25,"m":["Éplucher et couper les pommes de terre","Hacher le persil, préparer la chapelure dans une assiette"],"s":["Cuire les pommes de terre dans l'eau salée (20 min), les égoutter et les écraser.","Pocher le poisson dans l'eau frémissante (5 min), l'égoutter et l'émietter.","Mélanger purée, poisson, œuf, persil, sel et poivre ; former des galettes et les rouler dans la chapelure.","Les dorer dans une poêle huilée (3 min par face)."]},{"p":10,"c":10,"m":["Sécher les filets, presser le citron, hacher le persil","Préparer un peu de farine dans une assiette"],"s":["Saler, poivrer et fariner légèrement les filets.","Les cuire dans la moitié du beurre côté peau (3 min) puis côté chair (2 min), réserver au chaud.","Dans la même poêle, faire dorer les amandes dans le reste du beurre (2 min), ajouter jus de citron et persil.","Napper les truites et servir."]},{"p":10,"c":5,"m":["Retirer le muscle et le corail si besoin, rincer et bien sécher les noix sur du papier absorbant","Hacher l'ail et le persil"],"s":["Chauffer une poêle à feu vif avec un filet d'huile.","Saisir les noix sans les bouger jusqu'à ce qu'une croûte dorée se forme (1 min 30 par face) : le cœur doit rester nacré.","Baisser le feu, ajouter beurre, ail et persil, arroser 30 s. Saler, ajouter un filet de citron et servir."]},{"p":15,"c":10,"m":["Couper les calamars en anneaux de 1 cm, bien les sécher","Mélanger farine, paprika et sel","Chauffer l'huile à 180 °C"],"s":["Enrober les anneaux de farine assaisonnée et secouer l'excédent.","Les frire par petites quantités jusqu'à ce qu'ils soient dorés (2 min) : plus longtemps, ils deviennent caoutchouteux.","Égoutter sur papier absorbant, saler et servir avec le citron."]},{"p":10,"c":12,"m":["Mélanger sauce soja, miel, gingembre et ail râpés","Sécher les pavés"],"s":["Mariner le saumon dans la sauce (10 min).","Le cuire côté peau dans une poêle huilée (4 min), puis retourner (2 min).","Verser la marinade et la laisser réduire en arrosant le saumon jusqu'à ce qu'il soit laqué (2 min). Servir avec du riz et du sésame."]},{"p":25,"c":50,"m":["Couper aubergine, courgettes et poivrons en dés de 2 cm","Monder les tomates (5 min dans l'eau bouillante puis peler) et les concasser","Émincer l'oignon et l'ail"],"s":["Faire revenir séparément dans l'huile d'olive l'aubergine (8 min), les courgettes (5 min) et les poivrons (6 min) : chaque légume garde ainsi son goût.","Dans une cocotte, faire fondre l'oignon (5 min), ajouter l'ail et les tomates, cuire 10 min.","Ajouter tous les légumes, du thym, sel et poivre, couvrir et mijoter à feu doux (25 min).","Servir chaude ou froide : elle est encore meilleure le lendemain."]},{"p":15,"c":40,"m":["Préchauffer le four à 180 °C","Foncer un moule à tarte avec la pâte et la piquer à la fourchette","Faire dorer les lardons à sec (5 min) et les égoutter"],"s":["Précuire la pâte à blanc, recouverte de papier cuisson et de légumes secs (10 min).","Battre œufs, crème et lait, saler peu (les lardons le sont), poivrer, ajouter la muscade.","Répartir les lardons sur la pâte et verser l'appareil.","Cuire à 180 °C jusqu'à ce que la quiche soit dorée et que le centre ne tremble plus (30 min)."]},{"p":20,"c":40,"m":["Préchauffer le four à 180 °C","Foncer le moule avec la pâte, la piquer","Couper courgette et poivron en petits dés"],"s":["Précuire la pâte à blanc (10 min).","Faire revenir les légumes dans un filet d'huile jusqu'à ce qu'ils aient rendu leur eau (8 min), saler.","Battre œufs, crème et la moitié du fromage, saler, poivrer.","Répartir les légumes sur la pâte, verser l'appareil, parsemer du reste de fromage et cuire (30 min)."]},{"p":20,"c":40,"m":["Préchauffer le four à 180 °C","Fendre les poireaux, les laver soigneusement et les émincer","Foncer le moule avec la pâte, la piquer"],"s":["Faire fondre les poireaux dans une noix de beurre à couvert, à feu doux, jusqu'à ce qu'ils soient tendres (15 min), saler.","Précuire la pâte à blanc (10 min).","Battre œufs, crème et fromage, poivrer, mélanger aux poireaux et verser sur la pâte.","Cuire jusqu'à ce que la tarte soit dorée et prise (30 min)."]},{"p":20,"c":75,"m":["Préchauffer le four à 160 °C","Éplucher les pommes de terre et les couper en rondelles de 3 mm (sans les rincer : l'amidon lie la crème)","Frotter un plat à gratin avec une gousse d'ail coupée, puis le beurrer"],"s":["Dans une grande casserole, porter lait, crème, ail écrasé, sel, poivre et muscade à frémissement.","Ajouter les pommes de terre et cuire à feu doux en remuant délicatement (10 min) : le mélange épaissit.","Verser dans le plat, égaliser.","Cuire à 160 °C jusqu'à ce que le dessus soit doré et qu'un couteau traverse sans résistance (1 h à 1 h 15).","Laisser reposer 10 min avant de servir."]},{"p":15,"c":30,"m":["Préchauffer le four à 180 °C","Couper les courgettes en rondelles, frotter un plat avec l'ail"],"s":["Faire revenir les courgettes dans un filet d'huile jusqu'à ce qu'elles rendent leur eau (8 min), saler et égoutter.","Battre œufs, crème et la moitié du fromage, poivrer.","Disposer les courgettes dans le plat, verser l'appareil, couvrir du reste de fromage.","Cuire à 180 °C jusqu'à ce que ce soit pris et doré (25 min)."]},{"p":10,"c":20,"m":["Rincer et égoutter les pois chiches","Ciseler l'oignon, hacher l'ail","Laver les épinards"],"s":["Faire revenir l'oignon dans un filet d'huile (5 min), ajouter l'ail (1 min) et le curry (30 s).","Ajouter pois chiches et lait de coco, saler, mijoter (12 min).","Ajouter les épinards et laisser tomber 2 min. Servir avec du riz ou du naan."]},{"p":10,"c":25,"m":["Rincer les lentilles corail jusqu'à ce que l'eau soit claire","Ciseler l'oignon, hacher l'ail"],"s":["Faire revenir l'oignon (5 min), l'ail (1 min) et le curry (30 s) dans un filet d'huile.","Ajouter lentilles, tomates, lait de coco et 30 cl d'eau, saler.","Mijoter à feu doux en remuant souvent jusqu'à ce que les lentilles se défassent (20 min). Ajouter de l'eau si c'est trop épais."]},{"p":20,"c":10,"m":["Idéalement, utiliser des pois chiches secs trempés 12 h (non cuits) : les falafels se tiennent mieux","Égoutter et sécher les pois chiches","Éplucher oignon et ail, laver le persil"],"s":["Mixer pois chiches, oignon, ail, persil, cumin, sel et poivre par à-coups : la texture doit rester granuleuse.","Incorporer la farine, puis réfrigérer 30 min.","Former des boulettes un peu aplaties.","Les frire dans 2 cm d'huile à 175 °C jusqu'à ce qu'elles soient bien dorées (3 à 4 min). Égoutter."]},{"p":10,"c":0,"m":["Égoutter les pois chiches en gardant un peu de leur jus","Presser le citron, éplucher l'ail"],"s":["Mixer pois chiches, tahini, jus de citron, ail et sel.","Ajouter 3 à 4 c. à soupe de jus des pois chiches ou d'eau glacée en mixant 2 min jusqu'à obtenir une texture très lisse.","Servir dans un bol, creuser un puits et arroser d'huile d'olive, de paprika et de cumin."]},{"p":15,"c":15,"m":["Couper courgette, poivron et carottes en bâtonnets de même taille","Émincer l'oignon"],"s":["Chauffer l'huile d'olive dans une grande poêle à feu vif.","Faire sauter d'abord les carottes et l'oignon (5 min), puis le poivron (3 min), enfin la courgette (5 min).","Saler, poivrer, ajouter des herbes ; les légumes doivent rester légèrement croquants."]},{"p":15,"c":40,"m":["Préchauffer le four à 200 °C","Éplucher et couper patates douces et carottes en morceaux de 3 cm, les oignons en quartiers, le poivron en lanières"],"s":["Mélanger tous les légumes avec l'huile, le thym, sel et poivre sur une grande plaque, sans les entasser.","Rôtir à 200 °C (35 à 40 min) en les retournant à mi-cuisson, jusqu'à ce qu'ils soient tendres et caramélisés."]},{"p":10,"c":30,"m":["Ciseler l'oignon, couper le poivron en dés","Rincer haricots et maïs"],"s":["Faire revenir oignon et poivron dans un filet d'huile (6 min), ajouter le cumin et un peu de piment (1 min).","Ajouter tomates et haricots, saler, couvrir et mijoter (20 min).","Ajouter le maïs et cuire 5 min. Servir avec du riz et de la crème."]},{"p":10,"c":10,"m":["Couper la tomate en rondelles, laver la salade"],"s":["Toaster les pains côté mie dans une poêle sèche (1 min).","Cuire les steaks végétaux dans un filet d'huile selon le paquet (3 à 4 min par face).","Poser le cheddar sur les steaks, couvrir 1 min pour le faire fondre.","Monter les burgers : pain, sauce, salade, steak, tomate, pain."]},{"p":10,"c":20,"m":["Mélanger farine de sarrasin et sel, ajouter l'œuf puis l'eau petit à petit en fouettant","Laisser reposer la pâte au moins 1 h au frais (idéalement une nuit)","Préparer la garniture (jambon, fromage râpé, œufs)"],"s":["Chauffer une grande poêle ou une crêpière à feu vif et la graisser au beurre.","Verser une louche de pâte et l'étaler très finement ; cuire jusqu'à ce que les bords dorent (2 min).","Retourner, garnir (fromage, jambon, œuf cassé au centre) et cuire jusqu'à ce que le blanc d'œuf soit pris (2 à 3 min).","Replier les bords en carré et servir."]},{"p":10,"c":20,"m":["Mettre la farine dans un saladier, creuser un puits, ajouter les œufs","Verser le lait petit à petit en fouettant, puis le beurre fondu","Laisser reposer la pâte 30 min"],"s":["Chauffer une poêle et la graisser légèrement.","Verser une petite louche de pâte en inclinant la poêle pour couvrir le fond.","Cuire jusqu'à ce que le bord se décolle (1 min), retourner (30 s).","Garnir au choix (jambon, fromage, champignons, œuf) et replier."]},{"p":15,"c":12,"m":["Sortir la pâte du réfrigérateur 30 min avant","Préchauffer le four à 250 °C (le plus chaud possible) avec la plaque dedans","Égoutter la mozzarella et la couper en tranches, assaisonner la sauce tomate (sel, huile, origan)"],"s":["Étaler la pâte finement sur du papier cuisson.","Étaler la sauce tomate sans aller jusqu'aux bords, ajouter la mozzarella.","Glisser sur la plaque brûlante et cuire jusqu'à ce que les bords soient gonflés et dorés (10 à 12 min).","À la sortie, ajouter le basilic frais et un filet d'huile d'olive."]},{"p":15,"c":12,"m":["Préchauffer le four à 250 °C avec la plaque dedans","Couper courgette et poivron en fines lamelles","Égoutter la mozzarella"],"s":["Faire sauter les légumes 3 min dans un filet d'huile pour retirer leur eau.","Étaler la pâte, la sauce tomate, puis légumes et mozzarella.","Cuire jusqu'à ce que la pâte soit dorée (10 à 12 min)."]},{"p":20,"c":25,"m":["Préchauffer le four à 200 °C","Beurrer généreusement un moule à soufflé et le fariner (ou le chapelurer)","Séparer les blancs des jaunes, râper le fromage"],"s":["Béchamel épaisse : beurre fondu + farine 1 min, puis lait en fouettant jusqu'à épaississement (4 min). Saler, poivrer, muscade.","Hors du feu, incorporer les jaunes un à un puis le fromage.","Monter les blancs en neige ferme avec une pincée de sel.","Incorporer un tiers des blancs vivement, puis le reste délicatement avec une spatule, en soulevant.","Remplir le moule aux trois quarts et cuire à 200 °C sans ouvrir le four (20 à 25 min). Servir immédiatement : il retombe vite."]},{"p":15,"c":40,"m":["Préchauffer le four à 200 °C","Éplucher les oignons et les couper en deux ou en épaisses rondelles"],"s":["Dans une poêle allant au four (ou un moule), faire fondre beurre et sucre jusqu'à léger caramel (3 min).","Ranger les oignons serrés, saler, cuire à feu moyen jusqu'à ce qu'ils soient tendres et caramélisés (15 min), ajouter le vinaigre balsamique.","Couvrir de pâte feuilletée en rentrant les bords, piquer.","Cuire au four jusqu'à ce que la pâte soit dorée (25 min). Attendre 5 min et retourner sur un plat."]},{"p":15,"c":35,"m":["Préchauffer le four à 180 °C","Couper courgettes et tomates en dés","Couper le beurre froid en dés, râper le parmesan"],"s":["Faire revenir les courgettes 5 min dans un filet d'huile, mélanger aux tomates, saler, poivrer, mettre dans un plat.","Sabler du bout des doigts farine, beurre froid et parmesan jusqu'à obtenir une texture de gros sable.","Répartir sur les légumes.","Cuire à 180 °C jusqu'à ce que le crumble soit doré (30 min)."]},{"p":25,"c":45,"m":["Préchauffer le four à 180 °C","Couper les aubergines en tranches de 1 cm, les saler et les laisser dégorger 20 min, puis les essuyer","Rincer les lentilles"],"s":["Cuire les lentilles dans l'eau non salée (20 min), égoutter.","Rôtir les tranches d'aubergine huilées sur une plaque à 200 °C (20 min).","Mélanger lentilles et tomates, saler, poivrer, ajouter cannelle et origan, mijoter 10 min.","Préparer une béchamel (beurre + farine 1 min, lait en fouettant, 5 min).","Monter : aubergines, lentilles, aubergines, béchamel. Cuire à 180 °C jusqu'à ce que ce soit doré (35 min). Reposer 10 min."]},{"p":25,"c":35,"m":["Préchauffer le four à 180 °C","Couper les courgettes en dés, laver les épinards"],"s":["Faire revenir les courgettes (6 min), puis faire tomber les épinards (2 min), saler et égoutter.","Mélanger ricotta, légumes, sel, poivre et muscade.","Assaisonner les tomates.","Monter : tomate, feuilles, ricotta-légumes ; répéter et finir par tomate et fromage râpé.","Cuire à 180 °C (35 min), laisser reposer 10 min."]},{"p":20,"c":50,"m":["Nettoyer les champignons (gros morceaux), éplucher les carottes en rondelles épaisses, émincer les oignons"],"s":["Saisir les champignons dans l'huile à feu vif jusqu'à ce qu'ils soient bien dorés (8 min), réserver.","Dans une cocotte, faire revenir oignons et carottes (8 min), saupoudrer de farine et remuer 1 min.","Verser le vin, ajouter thym et laurier, saler, poivrer, porter à ébullition.","Remettre les champignons, couvrir et mijoter à feu doux jusqu'à ce que la sauce nappe (35 min). Servir avec une purée."]},{"p":10,"c":18,"m":["Retirer les feuilles abîmées des choux, inciser une croix à la base","Émincer l'ail"],"s":["Blanchir les choux dans l'eau bouillante salée (6 min), les égoutter (cela retire l'amertume).","Faire dorer les lardons à sec (4 min).","Ajouter le beurre et les choux coupés en deux, faire rissoler jusqu'à ce qu'ils soient dorés (8 min), ajouter l'ail en fin de cuisson."]},{"p":10,"c":25,"m":["Éplucher les pommes de terre (farineuses : bintje, agata) et les couper en morceaux égaux","Couper le beurre en dés"],"s":["Mettre les pommes de terre dans l'eau froide salée, porter à ébullition et cuire jusqu'à ce qu'un couteau s'y enfonce sans résistance (20 min).","Chauffer le lait.","Égoutter et écraser au presse-purée (jamais au mixeur : la purée deviendrait élastique).","Incorporer le beurre puis le lait chaud petit à petit ; saler, poivrer, muscade."]},{"p":10,"c":40,"m":["Préchauffer le four à 210 °C","Couper les pommes de terre en quartiers, écraser l'ail en chemise"],"s":["Précuire les pommes de terre 5 min dans l'eau bouillante salée, égoutter et secouer pour abîmer les bords (plus croustillant).","Les mélanger avec l'huile, l'ail, le thym et le sel sur une plaque.","Rôtir à 210 °C en les retournant à mi-cuisson jusqu'à ce qu'elles soient bien dorées (35 min)."]},{"p":5,"c":35,"m":["Retirer les feuilles abîmées des endives, les rincer rapidement, creuser le cône amer à la base"],"s":["Faire fondre le beurre dans une sauteuse, y ranger les endives.","Saupoudrer de sucre, ajouter le jus de citron, sel, et 5 cl d'eau.","Couvrir et cuire à feu doux (25 min) en les retournant à mi-cuisson.","Retirer le couvercle et laisser caraméliser (8 à 10 min)."]},{"p":15,"c":25,"m":["Préchauffer le four à 200 °C","Détailler le chou-fleur en bouquets","Râper le fromage"],"s":["Cuire les bouquets dans l'eau bouillante salée jusqu'à ce qu'ils soient tendres mais encore fermes (8 min), bien égoutter.","Béchamel : beurre + farine 1 min, lait en fouettant jusqu'à épaississement (5 min), saler, poivrer, muscade, ajouter la moitié du fromage.","Mettre le chou-fleur dans un plat, napper, couvrir du reste de fromage.","Gratiner à 200 °C (15 min)."]},{"p":15,"c":50,"m":["Éplucher les oignons et les émincer finement","Chauffer le bouillon"],"s":["Faire fondre les oignons dans le beurre à feu moyen-doux en remuant souvent jusqu'à ce qu'ils soient bien caramélisés et brun doré (30 min).","Ajouter 1 c. à soupe de farine (facultatif) puis le bouillon, poivrer, et mijoter (15 min).","Préchauffer le grill. Verser la soupe dans des bols allant au four, poser une tranche de pain grillé et couvrir de fromage.","Gratiner sous le grill jusqu'à ce que le fromage soit doré et bouillonnant (5 min)."]},{"p":15,"c":25,"m":["Éplucher carottes et pommes de terre, les couper en morceaux","Fendre, laver et émincer les poireaux, émincer l'oignon"],"s":["Faire revenir l'oignon et les poireaux dans un filet d'huile (5 min).","Ajouter carottes, pommes de terre et bouillon, porter à ébullition.","Cuire à couvert à frémissement jusqu'à ce que les légumes soient tendres (20 min).","Mixer ou laisser en morceaux ; saler, poivrer."]},{"p":15,"c":25,"m":["Éplucher le potiron, retirer les graines et le couper en cubes","Éplucher les pommes de terre et les couper"],"s":["Mettre potiron, pommes de terre et bouillon dans une casserole, porter à ébullition.","Cuire à couvert jusqu'à ce que tout soit très tendre (20 min).","Mixer finement, ajouter la crème, la muscade, saler et poivrer."]},{"p":10,"c":20,"m":["Laver les courgettes (garder la peau pour la couleur), les couper en tronçons","Éplucher et couper les pommes de terre"],"s":["Cuire courgettes et pommes de terre dans le bouillon frémissant (15 à 20 min).","Mixer finement, ajouter la crème, saler, poivrer. Servir avec du fromage frais ou des herbes."]},{"p":15,"c":25,"m":["Couper les tomates en quartiers, émincer l'oignon et l'ail"],"s":["Faire revenir l'oignon dans l'huile d'olive (5 min), puis l'ail (1 min).","Ajouter les tomates, sel, une pincée de sucre, et cuire (10 min) jusqu'à ce qu'elles se défassent.","Ajouter le bouillon et le basilic, cuire 10 min, puis mixer finement."]},{"p":15,"c":0,"m":["Laver les légumes ; éplucher le concombre, épépiner le poivron, éplucher l'ail","Couper tout en morceaux"],"s":["Mixer tomates, concombre, poivron et ail jusqu'à ce que ce soit très lisse.","Ajouter l'huile d'olive, 1 c. à soupe de vinaigre, sel et poivre, mixer encore.","Filtrer au chinois si vous voulez une texture fine.","Réfrigérer au moins 2 h : il se sert bien froid."]},{"p":20,"c":30,"m":["Couper le poisson en gros morceaux, retirer les arêtes","Émincer l'oignon et l'ail","Faire infuser le safran dans le bouillon chaud"],"s":["Faire revenir l'oignon et l'ail dans l'huile d'olive (5 min).","Ajouter tomates et bouillon safrané, saler, poivrer, mijoter (15 min).","Ajouter le poisson et cuire à frémissement (8 min).","Mixer pour une soupe lisse, ou laisser en morceaux. Servir avec des croûtons frottés à l'ail."]},{"p":10,"c":20,"m":["Éplucher les gousses d'ail et les émincer","Hacher le persil, griller les tranches de pain"],"s":["Faire revenir doucement l'ail dans l'huile d'olive sans le brunir (4 min).","Ajouter le bouillon, porter à ébullition et cuire à frémissement (15 min).","Poser une tranche de pain grillé au fond de chaque bol, verser la soupe et parsemer de persil. Un œuf poché peut s'ajouter dans chaque bol."]},{"p":15,"c":20,"m":["Nettoyer et émincer les champignons","Ciseler l'oignon"],"s":["Faire fondre l'oignon dans le beurre (4 min), ajouter les champignons et cuire jusqu'à évaporation de leur eau (8 min).","Verser le bouillon et cuire à frémissement (12 min).","Mixer finement, ajouter la crème, saler et poivrer."]},{"p":10,"c":30,"m":["Rincer les lentilles","Éplucher les carottes, ciseler l'oignon"],"s":["Faire revenir l'oignon et les carottes en rondelles dans un filet d'huile (5 min), ajouter le cumin (30 s).","Ajouter lentilles et bouillon, porter à ébullition.","Cuire à frémissement jusqu'à ce que les lentilles soient très tendres (25 min). Mixer en partie, saler, ajouter un filet de citron."]},{"p":20,"c":30,"m":["Couper carottes et courgette en petits dés","Rincer les haricots blancs"],"s":["Faire revenir les carottes dans l'huile d'olive (5 min).","Ajouter tomates et bouillon, porter à ébullition et cuire (10 min).","Ajouter courgette, haricots et petites pâtes, cuire jusqu'à ce que les pâtes soient tendres (10 min).","Saler, poivrer, servir avec du parmesan et du basilic."]},{"p":15,"c":15,"m":["Décortiquer les crevettes, émincer les champignons","Écraser la citronnelle et la couper en tronçons, râper le gingembre"],"s":["Porter bo
