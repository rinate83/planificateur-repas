uillon, citronnelle et gingembre à frémissement (5 min) pour infuser.","Ajouter le lait de coco et les champignons, cuire 5 min.","Ajouter les crevettes et cuire jusqu'à ce qu'elles soient roses (3 min). Assaisonner de sauce poisson et de citron vert, ajouter de la coriandre. Retirer la citronnelle."]},{"p":10,"c":20,"m":["Détailler le brocoli en bouquets (éplucher et couper la tige aussi)","Éplucher et couper les pommes de terre"],"s":["Cuire pommes de terre et brocoli dans le bouillon frémissant jusqu'à ce qu'ils soient tendres (15 min) : pas plus, pour garder une belle couleur verte.","Mixer finement, ajouter la crème, saler, poivrer."]},{"p":15,"c":30,"m":["Éplucher la citrouille, retirer les graines, la couper en cubes","Émincer l'oignon"],"s":["Faire revenir l'oignon dans un filet d'huile (5 min).","Ajouter citrouille et bouillon, porter à ébullition et cuire à couvert (20 à 25 min).","Mixer finement, ajouter la crème et la cannelle, saler, poivrer."]},{"p":10,"c":50,"m":["Rincer les pois cassés (pas de trempage nécessaire)","Éplucher les carottes, émincer l'oignon"],"s":["Faire revenir les lardons (4 min), ajouter oignon et carottes (5 min).","Ajouter pois cassés et bouillon, porter à ébullition et écumer.","Cuire à frémissement en remuant de temps en temps jusqu'à ce que les pois soient défaits (45 min).","Mixer, rectifier l'assaisonnement et allonger d'eau si c'est trop épais."]},{"p":15,"c":60,"m":["Éplucher carottes et oignon, laver le poireau","Couper les légumes en gros tronçons"],"s":["Mettre le poulet et les légumes dans une marmite, couvrir de bouillon (ou d'eau) froid, ajouter le bouquet d'herbes.","Porter à ébullition, écumer, puis cuire à petit frémissement (1 h) sans faire bouillir fort pour garder le bouillon clair.","Retirer le poulet, l'effilocher ; filtrer le bouillon.","Remettre le poulet dans le bouillon avec quelques légumes en dés, saler, poivrer. Ajouter des vermicelles 5 min avant de servir si vous le souhaitez."]},{"p":10,"c":25,"m":["Couper les betteraves cuites en dés","Éplucher et couper les pommes de terre, émincer l'oignon"],"s":["Faire revenir l'oignon dans un filet d'huile (5 min).","Ajouter pommes de terre et bouillon, cuire (15 min).","Ajouter les betteraves, cuire encore 5 min, puis mixer.","Ajouter un filet de vinaigre, saler, poivrer, servir avec une cuillère de crème."]},{"p":15,"c":25,"m":["Éplucher les carottes et les couper en rondelles","Émincer l'oignon, râper le gingembre"],"s":["Faire revenir l'oignon et le gingembre dans un filet d'huile (5 min).","Ajouter carottes et bouillon, porter à ébullition et cuire jusqu'à ce que les carottes soient très tendres (20 min).","Mixer finement, ajouter la crème, saler, poivrer."]},{"p":20,"c":10,"m":["Cuire les œufs durs : 9 min dans l'eau bouillante, puis eau froide ; écaler et couper en quartiers","Cuire les haricots verts dans l'eau bouillante salée (6 à 8 min), les plonger dans l'eau glacée","Couper les tomates en quartiers, égoutter le thon"],"s":["Préparer la vinaigrette : huile d'olive, 1 c. à soupe de vinaigre, sel, poivre.","Disposer tomates, haricots, thon, œufs et olives dans les assiettes.","Arroser de vinaigrette juste avant de servir."]},{"p":15,"c":10,"m":["Laver et essorer la laitue, la couper en morceaux","Faire des copeaux de parmesan"],"s":["Saler et poivrer le poulet, le cuire dans une poêle huilée (5 à 6 min par face) jusqu'à ce qu'il soit doré et cuit à cœur. Laisser reposer 5 min puis trancher.","Mélanger la laitue avec la sauce César.","Ajouter le poulet, les croûtons et le parmesan, servir aussitôt."]},{"p":10,"c":0,"m":["Laver les tomates et les couper en rondelles, émincer finement l'oignon","Effeuiller le basilic"],"s":["Disposer les tomates sur un plat, saler (fleur de sel), poivrer.","Parsemer d'oignon et de basilic, arroser d'huile d'olive. Laisser reposer 10 min pour que les tomates rendent leur jus."]},{"p":15,"c":0,"m":["Couper tomates et concombre en gros morceaux","Émincer l'oignon rouge"],"s":["Mélanger tomates, concombre, oignon et olives dans un saladier.","Poser la feta en bloc ou en gros cubes par-dessus, parsemer d'origan.","Arroser d'huile d'olive et d'un filet de vinaigre, saler peu (la feta est salée)."]},{"p":15,"c":10,"m":["Porter l'eau à ébullition","Couper les tomates cerises en deux et la mozzarella en dés"],"s":["Cuire les pâtes al dente (10 min), les rincer à l'eau froide et les égoutter.","Mélanger avec tomates, mozzarella, basilic, huile d'olive, sel et poivre.","Réfrigérer 30 min avant de servir."]},{"p":15,"c":12,"m":["Rincer le riz","Égoutter thon et maïs, couper les tomates en dés"],"s":["Cuire le riz dans un grand volume d'eau salée (11 à 12 min), le rincer à l'eau froide et bien l'égoutter.","Mélanger riz, thon, maïs et tomates.","Assaisonner d'huile, d'un filet de vinaigre, sel et poivre. Réfrigérer avant de servir."]},{"p":10,"c":25,"m":["Rincer les lentilles","Ciseler l'échalote, couper la carotte en petits dés"],"s":["Mettre les lentilles dans l'eau froide non salée avec la carotte, porter à ébullition et cuire (20 à 25 min) : elles doivent rester fermes. Saler en fin de cuisson.","Égoutter et assaisonner tiède avec huile, vinaigre, échalote, sel et poivre (les lentilles tièdes absorbent mieux la sauce)."]},{"p":15,"c":15,"m":["Rincer le quinoa dans une passoire fine (retire l'amertume)","Couper concombre et tomates en dés, émietter la feta"],"s":["Cuire le quinoa dans 2 fois son volume d'eau salée, à couvert (12 min), puis laisser reposer 5 min et égrainer.","Laisser refroidir, puis mélanger avec les légumes, la feta, l'huile, un filet de citron, sel et poivre."]},{"p":20,"c":0,"m":["Couper tomates et concombre en très petits dés","Ciseler la menthe, presser les citrons"],"s":["Mettre la semoule dans un saladier avec le jus de citron, l'huile et 20 cl d'eau tiède salée ; couvrir et laisser gonfler (10 min).","Égrainer à la fourchette.","Ajouter légumes et menthe, mélanger, saler, poivrer.","Réfrigérer au moins 1 h pour que les saveurs se mélangent."]},{"p":10,"c":5,"m":["Préchauffer le grill du four","Laver le mesclun, couper les crottins en deux dans l'épaisseur"],"s":["Poser le chèvre sur les tranches de pain, arroser d'un filet de miel.","Passer sous le grill jusqu'à ce que le fromage soit doré et fondant (4 à 5 min).","Assaisonner le mesclun d'huile et d'un filet de vinaigre, poser les toasts chauds dessus."]},{"p":15,"c":12,"m":["Laver et essorer la salade, couper les tomates","Égoutter le maïs"],"s":["Cuire le poulet dans une poêle huilée (5 à 6 min par face), saler, poivrer, laisser reposer puis émincer.","Mélanger salade, tomates et maïs avec l'huile et un filet de vinaigre.","Ajouter le poulet tiède et servir."]},{"p":10,"c":0,"m":["Laver et essorer la salade, couper les tomates","Émincer l'oignon, égoutter le thon"],"s":["Préparer une vinaigrette (huile, vinaigre, moutarde, sel, poivre).","Mélanger salade, tomates, oignon, olives et thon émietté, arroser de vinaigrette."]},{"p":10,"c":0,"m":["Laver et sécher la mâche délicatement","Couper la betterave en dés, concasser les noix"],"s":["Préparer la vinaigrette : huile de noix + balsamique, sel, poivre.","Assaisonner la mâche au dernier moment (elle flétrit vite), ajouter betterave et noix."]},{"p":20,"c":8,"m":["Gratter et laver les moules, décortiquer les crevettes","Laver la salade, presser le citron"],"s":["Cuire les moules à couvert dans une casserole à feu vif avec un fond d'eau jusqu'à ce qu'elles s'ouvrent (5 min), les décortiquer.","Faire sauter les crevettes 2 min dans un filet d'huile.","Disposer la salade, les fruits de mer, arroser d'huile et de citron, poivrer."]},{"p":15,"c":20,"m":["Laver les pommes de terre (variété à chair ferme : charlotte, roseval)","Ciseler l'échalote"],"s":["Cuire les pommes de terre avec la peau dans l'eau salée (20 min).","Préparer la vinaigrette : moutarde, vinaigre, huile, sel, poivre, échalote.","Peler les pommes de terre encore chaudes, les couper en rondelles et les mélanger tout de suite à la vinaigrette (elles l'absorbent mieux tièdes)."]},{"p":15,"c":0,"m":["Presser le citron","Couper les pommes en dés (avec la peau) et les citronner pour qu'elles ne noircissent pas","Émincer le céleri, concasser les noix"],"s":["Mélanger pommes, céleri et noix.","Ajouter la mayonnaise, saler, poivrer, mélanger.","Réfrigérer 20 min avant de servir."]},{"p":10,"c":0,"m":["Éplucher les concombres, les couper en fines rondelles","Hacher la menthe et l'ail"],"s":["Saler les concombres et les laisser dégorger 15 min dans une passoire, puis les presser légèrement.","Mélanger yaourt, ail, menthe, huile, sel et poivre.","Ajouter les concombres, mélanger et servir frais."]},{"p":15,"c":0,"m":["Rincer et égoutter les pois chiches","Couper tomates et concombre en dés, émietter la feta"],"s":["Mélanger pois chiches, légumes et feta.","Assaisonner d'huile d'olive, d'un filet de citron, cumin, sel et poivre. Ajouter du persil si vous en avez."]},{"p":5,"c":4,"m":["Casser les œufs dans un bol, saler, poivrer","Hacher le persil"],"s":["Battre les œufs à la fourchette juste assez pour mélanger blancs et jaunes (20 s), ajouter le persil.","Faire mousser le beurre dans une poêle antiadhésive à feu moyen-vif.","Verser les œufs, remuer 20 s avec une spatule en ramenant les bords vers le centre, puis laisser prendre (1 à 2 min) : le dessus doit rester baveux.","Plier l'omelette en trois et la faire glisser sur l'assiette."]},{"p":10,"c":8,"m":["Nettoyer et émincer les champignons","Battre les œufs avec sel et poivre, hacher le persil"],"s":["Faire sauter les champignons dans la moitié du beurre à feu vif jusqu'à ce qu'ils soient dorés et secs (5 min), saler, réserver.","Faire mousser le reste du beurre, verser les œufs, remuer 20 s puis laisser prendre (1 à 2 min).","Répartir champignons et persil sur une moitié, replier et servir."]},{"p":5,"c":6,"m":["Casser les œufs dans une casserole froide, ajouter la moitié du beurre","Ciseler la ciboulette"],"s":["Cuire à feu doux en remuant sans arrêt avec une spatule (4 à 6 min) ; retirer du feu quelques secondes si ça prend trop vite.","Quand les œufs sont crémeux mais encore légèrement coulants, ajouter hors du feu le reste du beurre et la crème (ils stoppent la cuisson).","Saler, poivrer, parsemer de ciboulette et servir aussitôt sur du pain grillé."]},{"p":5,"c":4,"m":["Utiliser des œufs très frais, casser chacun dans une petite tasse","Faire griller le pain"],"s":["Porter 1 L d'eau à frémissement (petites bulles, pas d'ébullition) avec le vinaigre, sans sel.","Créer un tourbillon avec une cuillère et faire glisser l'œuf au centre.","Pocher (3 min) : le blanc doit être pris, le jaune coulant.","Égoutter avec une écumoire, poser sur le pain grillé, saler, poivrer."]},{"p":10,"c":10,"m":["Sortir les œufs du réfrigérateur 10 min avant","Ciseler la ciboulette"],"s":["Plonger les œufs dans l'eau bouillante et cuire (10 min), puis les refroidir dans l'eau glacée.","Écaler, couper en deux dans la longueur, retirer les jaunes.","Écraser les jaunes avec mayonnaise, moutarde, sel et poivre.","Garnir les blancs à la cuillère ou à la poche, parsemer de ciboulette (et de jaune émietté pour l'effet « mimosa »)."]},{"p":10,"c":20,"m":["Émincer l'oignon et le poivron"],"s":["Faire revenir oignon et poivron dans l'huile d'olive jusqu'à ce qu'ils soient tendres (8 min), ajouter le cumin (et du paprika) 30 s.","Ajouter les tomates, saler, poivrer, et laisser réduire (8 min).","Creuser 4 puits, y casser les œufs, couvrir et cuire à feu doux jusqu'à ce que les blancs soient pris et les jaunes encore coulants (5 à 7 min).","Parsemer de coriandre ou de persil et servir dans la poêle avec du pain."]},{"p":5,"c":10,"m":["Préchauffer le four à 200 °C (ou utiliser une poêle)","Beurrer les tranches de pain sur une face"],"s":["Monter : pain (beurre à l'extérieur), jambon, fromage, pain, puis du fromage sur le dessus.","Cuire au four jusqu'à ce que ce soit doré et fondant (8 à 10 min), ou à la poêle 3 min par face.","Pendant ce temps, cuire les œufs au plat dans une poêle beurrée (3 min).","Poser un œuf sur chaque croque et servir."]},{"p":5,"c":8,"m":["Battre œufs, lait et sucre dans une assiette creuse"],"s":["Tremper les tranches de pain dans le mélange (quelques secondes par face si pain frais, plus s'il est très rassis).","Les cuire dans le beurre moussant à feu moyen jusqu'à ce qu'elles soient dorées (2 à 3 min par face).","Saupoudrer de sucre ou de cannelle et servir chaud."]},{"p":10,"c":15,"m":["Mélanger farine, sucre, levure et une pincée de sel","Battre œufs et lait, faire fondre une noix de beurre"],"s":["Verser le liquide sur les poudres et mélanger juste assez pour qu'il n'y ait plus de farine sèche : quelques grumeaux, c'est normal.","Laisser reposer 10 min.","Chauffer une poêle légèrement beurrée à feu moyen, verser une petite louche de pâte.","Retourner quand des bulles apparaissent à la surface (2 min), cuire 1 min de l'autre côté."]},{"p":10,"c":15,"m":["Faire fondre le beurre","Mélanger farine, sucre et une pincée de sel","Préchauffer et graisser le gaufrier"],"s":["Ajouter les œufs puis le lait petit à petit en fouettant, puis le beurre fondu.","Laisser reposer la pâte 30 min si possible.","Verser une louche de pâte dans le gaufrier chaud, fermer et cuire jusqu'à ce que les gaufres soient dorées (3 à 4 min).","Servir aussitôt avec sucre glace, chocolat ou chantilly."]},{"p":10,"c":20,"m":["Faire fondre le beurre","Mettre farine, sucre et sel dans un saladier, creuser un puits"],"s":["Ajouter les œufs, puis le lait petit à petit en fouettant pour éviter les grumeaux, puis le beurre fondu.","Laisser reposer la pâte 30 min à 1 h.","Chauffer une poêle légèrement graissée, verser une petite louche en inclinant pour couvrir le fond.","Cuire jusqu'à ce que les bords dorent (1 min), retourner (30 s)."]},{"p":3,"c":6,"m":["Couper la banane en rondelles"],"s":["Mettre flocons et lait dans une casserole avec une pincée de sel.","Cuire à feu doux en remuant jusqu'à ce que le porridge soit crémeux (5 à 6 min).","Verser dans les bols, ajouter la banane et le miel."]},{"p":5,"c":5,"m":["Concasser grossièrement les noix"],"s":["Faire griller les flocons à sec dans une poêle en remuant (4 min) jusqu'à ce qu'ils sentent bon la noisette.","Ajouter le miel et mélanger 1 min.","Laisser refroidir, ajouter noix et raisins. Se conserve 2 semaines en bocal."]},{"p":5,"c":4,"m":["Presser le citron","Préparer une casserole d'eau frémissante pour les œufs"],"s":["Faire griller le pain.","Pocher les œufs dans l'eau frémissante vinaigrée (3 min).","Écraser l'avocat avec le jus de citron, sel et poivre.","Tartiner le pain, poser l'œuf poché, ajouter le piment."]},{"p":5,"c":8,"m":["Préchauffer le four à 200 °C (ou chauffer une poêle)","Beurrer le pain sur une face"],"s":["Monter : pain (beurre dehors), jambon, fromage, pain.","Cuire à la poêle à feu moyen (3 min par face) ou au four (8 à 10 min) jusqu'à ce que ce soit doré et fondant."]},{"p":5,"c":0,"m":["Sortir le beurre pour qu'il soit mou"],"s":["Couper la baguette en deux dans la longueur.","Beurrer généreusement les deux côtés, garnir de jambon et de cornichons émincés."]},{"p":10,"c":0,"m":["Égoutter le thon, laver la salade"],"s":["Mélanger le thon avec la mayonnaise, sel, poivre (et un peu de citron).","Garnir le pain de salade et de thon."]},{"p":10,"c":10,"m":["Laver la salade, couper la tomate en rondelles"],"s":["Cuire le poulet dans une poêle huilée (5 à 6 min par face), le laisser reposer puis le trancher.","Tartiner le pain de mayonnaise, garnir de salade, tomate et poulet."]},{"p":10,"c":10,"m":["Laver la salade, couper la tomate en dés","Mélanger le yaourt avec sel, poivre et herbes"],"s":["Cuire le poulet en lanières dans une poêle huilée jusqu'à ce qu'il soit doré (6 à 8 min), saler, poivrer.","Réchauffer les tortillas 20 s dans une poêle sèche.","Garnir de salade, tomate, poulet et sauce yaourt, puis rouler serré en rabattant le bas."]},{"p":10,"c":0,"m":["Râper la carotte, couper le concombre en bâtonnets, laver la salade"],"s":["Tartiner les tortillas de houmous.","Garnir de légumes et de salade, saler, poivrer, puis rouler serré."]},{"p":5,"c":6,"m":["Couper la mozzarella et la tomate en tranches"],"s":["Ouvrir les pains, garnir de mozzarella, tomate et basilic, ajouter un filet d'huile.","Cuire dans un appareil à panini, ou dans une poêle en pressant avec une casserole (3 min par face), jusqu'à ce que ce soit croustillant et fondant."]},{"p":5,"c":2,"m":["Ciseler la ciboulette, la mélanger au fromage frais"],"s":["Couper les bagels en deux et les toaster (2 min).","Tartiner de fromage frais, ajouter le saumon fumé, poivrer et ajouter un filet de citron."]},{"p":15,"c":12,"m":["Couper la tomate en rondelles"],"s":["Cuire le poulet dans une poêle huilée (5 à 6 min par face), trancher.","Faire griller les lardons à sec (4 min), griller les tranches de pain.","Monter sur 3 étages : pain, mayonnaise, poulet, tomate, pain, lardons, salade, pain.","Piquer avec des cure-dents et couper en triangles."]},{"p":5,"c":6,"m":["Laver la salade, couper la tomate en rondelles"],"s":["Faire griller les lardons (ou tranches de bacon) à sec jusqu'à ce qu'ils soient croustillants (5 min).","Griller le pain, tartiner de mayonnaise.","Garnir de salade, tomate et bacon, refermer."]},{"p":5,"c":10,"m":["Ciseler la ciboulette"],"s":["Cuire les œufs durs (10 min dans l'eau bouillante), les refroidir dans l'eau glacée et les écaler.","Les écraser à la fourchette avec mayonnaise, ciboulette, sel et poivre.","Garnir le pain."]},{"p":15,"c":20,"m":["Rincer les haricots, râper le fromage si besoin"],"s":["Cuire le riz (12 min).","Faire dorer le bœuf dans un filet d'huile (6 min), ajouter les haricots, cumin, sel et poivre (3 min).","Réchauffer les tortillas, garnir de riz, viande et fromage.","Rabattre les côtés puis rouler serré. Les dorer 1 min par face dans la poêle pour les sceller."]},{"p":10,"c":10,"m":["Émincer le poivron, couper le poulet en lanières"],"s":["Faire sauter poulet et poivron dans un filet d'huile (6 min), saler, poivrer, épicer.","Sur une tortilla, étaler fromage, garniture, fromage, puis couvrir d'une 2e tortilla.","Cuire dans une poêle sèche à feu moyen jusqu'à ce que le fromage fonde et que la tortilla dore (2 min par face). Couper en parts."]},{"p":10,"c":12,"m":["Couper le poulet, le poivron et l'oignon en lanières","Mélanger le poulet avec les épices et un filet d'huile"],"s":["Saisir le poulet dans une poêle très chaude (5 min), réserver.","Faire sauter poivron et oignon à feu vif (5 min) : ils doivent rester un peu croquants.","Remettre le poulet 1 min, servir avec les tortillas chaudes, crème et guacamole."]},{"p":30,"c":60,"m":["Couper l'agneau et le poulet en morceaux","Éplucher carottes et courgettes, les couper en gros tronçons","Rincer les pois chiches"],"s":["Dans un grand faitout, dorer agneau et poulet dans l'huile (10 min), ajouter un oignon émincé et ras-el-hanout (2 min).","Couvrir d'eau (2 L), ajouter les carottes, saler, et mijoter (40 min).","Ajouter courgettes et pois chiches, cuire encore 20 min.","Griller les merguez à la poêle (10 min).","Préparer la semoule : verser dessus le même volume d'eau bouillante salée avec un filet d'huile, couvrir 5 min, puis égrainer à la fourchette avec une noix de beurre."]},{"p":20,"c":50,"m":["Émincer les oignons, hacher l'ail","Couper le citron confit en quartiers (retirer la pulpe si on le veut moins fort)"],"s":["Dorer les cuisses dans l'huile d'olive au fond du tajine ou d'une cocotte (8 min), réserver.","Faire fondre les oignons (8 min), ajouter ail, cumin, gingembre et curcuma (1 min).","Remettre le poulet, ajouter 25 cl d'eau, couvrir et mijoter à feu doux (30 min).","Ajouter le citron confit et les olives, poursuivre 10 min sans couvercle pour réduire la sauce."]},{"p":20,"c":75,"m":["Couper l'agneau (épaule) en gros cubes","Émincer les oignons","Faire tremper les pruneaux dans de l'eau tiède"],"s":["Dorer l'agneau dans l'huile (8 min), ajouter les oignons (6 min), la cannelle et un peu de gingembre.","Couvrir d'eau à hauteur, saler, couvrir et mijoter à feu doux (1 h).","Ajouter pruneaux égouttés et miel, cuire 15 min sans couvercle pour réduire.","Faire dorer les amandes à sec (3 min) et en parsemer le tajine."]},{"p":20,"c":35,"m":["Éplucher carottes, navet et courgettes, les couper en gros morceaux","Couper les tomates en quartiers, rincer les pois chiches"],"s":["Faire revenir un oignon émincé dans l'huile avec ras-el-hanout (3 min).","Ajouter carottes, navet, tomates et 1,5 L d'eau, saler, mijoter (20 min).","Ajouter courgettes et pois chiches, cuire 15 min.","Préparer la semoule à l'eau bouillante salée (5 min à couvert), puis égrainer avec un filet d'huile ou une noix de beurre."]},{"p":15,"c":10,"m":["Faire tremper les nouilles de riz dans l'eau tiède (20 min), égoutter","Décortiquer les crevettes, concasser les cacahuètes","Mélanger sauce soja, 1 c. à soupe de sucre et le jus du citron vert (sauce)"],"s":["Saisir les crevettes dans un wok très chaud et huilé (2 min), réserver.","Pousser sur le côté, brouiller les œufs (1 min).","Ajouter les nouilles et la sauce, sauter en remuant (3 min) jusqu'à ce qu'elles soient tendres.","Remettre les crevettes, ajouter des pousses de soja si vous en avez, servir avec cacahuètes et quartiers de citron vert."]},{"p":25,"c":10,"m":["Cuire les nouilles de riz (selon le paquet, environ 4 min), les rincer à l'eau froide","Râper les carottes, couper le concombre en bâtonnets, émincer la salade","Émincer finement le bœuf et le mariner 10 min avec sauce soja et ail","Préparer la sauce : 3 c. à soupe de nuoc-mâm, 3 d'eau, 1 de sucre, jus de citron vert"],"s":["Cuire ou réchauffer les nems au four à 200 °C (10 min).","Saisir le bœuf dans un wok très chaud (2 à 3 min).","Dans des bols : salade, nouilles, crudités, bœuf chaud et nems coupés en morceaux.","Arroser de sauce, parsemer d'herbes et de cacahuètes."]},{"p":30,"c":12,"m":["Faire tremper champignons noirs et vermicelles dans l'eau chaude (10 min), égoutter et couper","Râper les carottes"],"s":["Mélanger porc, carottes, champignons, vermicelles, sel, poivre (et un œuf pour lier).","Tremper chaque galette 2 s dans l'eau tiède, la poser sur un torchon humide.","Déposer une cuillère de farce, rabattre les côtés et rouler serré.","Frire dans l'huile à 170 °C jusqu'à ce qu'ils soient dorés et croustillants (6 à 8 min). Égoutter et servir avec salade, menthe et sauce."]},{"p":30,"c":15,"m":["Rincer le riz jusqu'à ce que l'eau soit claire, le laisser égoutter 15 min","Couper le saumon (qualité sashimi) et l'avocat en bâtonnets","Préparer un bol d'eau vinaigrée pour les mains"],"s":["Cuire le riz avec 1,1 fois son volume d'eau, couvert, à feu doux (12 min), puis reposer 10 min sans soulever le couvercle.","Mélanger le vinaigre de riz avec 1 c. à soupe de sucre et 1 c. à café de sel, l'incorporer au riz en le coupant à la spatule, et le laisser tiédir.","Sur une natte, poser une feuille de nori, étaler une fine couche de riz en laissant 2 cm en haut.","Disposer saumon et avocat, rouler en serrant, humidifier le bord pour sceller.","Couper chaque rouleau en 8 avec un couteau mouillé. Servir avec soja, wasabi et gingembre."]},{"p":25,"c":15,"m":["Rincer le riz et le laisser égoutter 15 min","Épépiner le concombre et le couper en bâtonnets fins"],"s":["Cuire le riz (12 min) puis le laisser reposer 10 min à couvert.","Assaisonner du vinaigre sucré-salé et laisser tiédir.","Sur une demi-feuille de nori, étaler le riz finement, poser le concombre, rouler serré.","Couper en 6 avec un couteau mouillé."]},{"p":20,"c":15,"m":["Rincer le riz (rond ou à sushi)","Mélanger thon égoutté et mayonnaise","Couper le nori en bandes"],"s":["Cuire le riz (12 min), reposer 10 min, le saler légèrement et le laisser tiédir.","Mains mouillées et salées, prendre une poignée de riz, creuser, mettre une cuillère de thon, refermer.","Presser en triangle sans trop tasser.","Entourer la base d'une bande de nori au moment de servir (pour qu'elle reste croquante)."]},{"p":20,"c":30,"m":["Émincer les ciboules","Couper le porc (échine ou poitrine) en tranches fines"],"s":["Cuire les œufs mollets : 6 min 30 dans l'eau bouillante, puis eau glacée. Les écaler et les mariner dans la sauce soja + un peu d'eau (au moins 15 min).","Chauffer le bouillon avec 2 c. à soupe de sauce soja, ail et gingembre, et le laisser frémir (15 min).","Saisir le porc dans une poêle chaude (3 min par face).","Cuire les nouilles séparément (selon le paquet, 2 à 4 min), les égoutter.","Dans les bols : nouilles, bouillon brûlant, porc, demi-œufs et ciboule."]},{"p":15,"c":30,"m":["Couper le poulet en cubes, le mariner dans yaourt + la moitié des épices + sel (30 min minimum)","Émincer un oignon, hacher ail et gingembre"],"s":["Saisir le poulet mariné dans une poêle très chaude ou sous le grill jusqu'à ce qu'il soit bien coloré (8 min), réserver.","Faire revenir l'oignon (6 min), l'ail et le gingembre (1 min), puis le reste des épices (30 s).","Ajouter les tomates et mijoter (10 min), mixer si vous voulez une sauce lisse.","Ajouter crème et poulet, mijoter 8 min. Servir avec riz basmati et naan."]},{"p":25,"c":50,"m":["Mariner le poulet en morceaux dans yaourt + épices + sel (1 h minimum)","Rincer le riz basmati et le faire tremper 30 min","Émincer finement les oignons, infuser le safran dans 3 c. à soupe de lait chaud"],"s":["Faire frire les oignons dans l'huile jusqu'à ce qu'ils soient bien dorés (15 min), en garder la moitié pour le dessus.","Ajouter le poulet mariné et cuire (15 min).","Précuire le riz 5 min dans l'eau bouillante salée, égoutter.","Étaler le riz sur le poulet, arroser du lait safrané, parsemer d'oignons frits.","Couvrir hermétiquement et cuire à feu très doux (20 min). Laisser reposer 5 min puis servir en mélangeant."]},{"p":20,"c":10,"m":["Mélanger farine, levure, une pincée de sel et de sucre, le yaourt et environ 10 cl d'eau tiède","Pétrir 5 min jusqu'à obtenir une pâte souple, laisser lever 1 h à couvert","Faire fondre le beurre"],"s":["Diviser la pâte en 4 boules, aplatir chacune, mettre du fromage au centre, refermer et réétaler délicatement.","Cuire dans une poêle très chaude, sans matière grasse et à couvert, jusqu'à ce que la pâte gonfle et dore (2 à 3 min par face).","Badigeonner de beurre fondu (avec de l'ail si vous voulez) et servir chaud."]},{"p":15,"c":20,"m":["Couper le poulet en lamelles, les aubergines en morceaux","Effeuiller le basilic thaï"],"s":["Chauffer 3 c. à soupe de la partie épaisse du lait de coco et y faire revenir la pâte de curry (2 min) jusqu'à ce qu'elle soit parfumée.","Ajouter le poulet et cuire (4 min).","Verser le reste du lait de coco et les aubergines, mijoter jusqu'à ce que les aubergines soient tendres (10 min).","Assaisonner de sauce poisson et d'un peu de sucre, ajouter le basilic hors du feu. Servir avec du riz jasmin."]},{"p":20,"c":12,"m":["Couper le poulet en lanières, le mariner avec 1 c. à soupe de sauce soja, curry et ail (20 min)","Enfiler sur des piques trempées dans l'eau","Sauce : chauffer doucement beurre de cacahuète, lait de coco, sauce soja et jus de citron vert en fouettant (3 min)"],"s":["Cuire les brochettes dans une poêle-gril ou sous le grill du four (8 à 10 min) en les retournant.","Servir avec la sauce cacahuète tiède et du riz."]},{"p":15,"c":15,"m":["Utiliser du riz cuit la veille et froid","Couper le poulet en dés, émincer les ciboules"],"s":["Saisir le poulet dans un wok chaud et huilé (5 min).","Ajouter le riz froid et le sauter à feu vif (4 min), assaisonner de sauce soja (et sauce sucrée kecap manis si vous en avez).","Cuire les œufs au plat à part (3 min).","Servir le riz parsemé de ciboule, un œuf au plat dessus."]},{"p":30,"c":45,"m":["Préchauffer le four à 180 °C","Couper les aubergines en tranches de 1 cm, les saler et laisser dégorger 20 min, puis les essuyer","Émincer un oignon"],"s":["Rôtir les aubergines huilées sur une plaque à 200 °C (20 min).","Faire revenir l'oignon (5 min), puis le bœuf (6 min), ajouter tomates, cannelle, sel, poivre ; mijoter (15 min).","Préparer une béchamel épaisse (beurre + farine 1 min, lait en fouettant, 5 min), y ajouter un jaune d'œuf hors du feu si vous le souhaitez.","Monter : aubergines, viande, aubergines, béchamel.","Cuire à 180 °C jusqu'à ce que le dessus soit doré (40 min). Laisser reposer 15 min avant de couper."]},{"p":25,"c":20,"m":["Préchauffer le four à 200 °C","Cuire 1 œuf dur (10 min), le hacher ; battre l'autre pour la dorure","Émincer l'oignon"],"s":["Faire revenir l'oignon (5 min) puis le bœuf (6 min), ajouter cumin, paprika, sel, poivre ; laisser refroidir et ajouter l'œuf dur.","Découper des disques de 12 cm dans la pâte.","Garnir d'une cuillère de farce, replier en demi-lune et souder en pinçant les bords.","Badigeonner d'œuf battu et cuire à 200 °C jusqu'à ce qu'ils soient dorés (18 à 20 min)."]},{"p":15,"c":15,"m":["Couper les tomates en dés, rincer les haricots","Préparer le fromage et des garnitures (salade, oignon, crème)"],"s":["Dorer le bœuf dans un filet d'huile (6 min), ajouter épices et haricots (3 min), puis 5 cl d'eau et laisser réduire 3 min.","Réchauffer les tortillas dans une poêle sèche (20 s par face).","Garnir de viande, tomate et fromage, servir avec citron vert et coriandre."]},{"p":20,"c":40,"m":["Préchauffer le four à 190 °C","Foncer le moule avec la pâte et la piquer","Éplucher les pommes, en couper 2 en dés et 4 en fines lamelles"],"s":["Cuire les dés de pomme avec 30 g de sucre et un fond d'eau jusqu'à obtenir une compote (10 min), l'étaler sur la pâte.","Disposer les lamelles en rosace en les faisant se chevaucher.","Saupoudrer du reste de sucre et de cannelle, parsemer de noisettes de beurre.","Cuire à 190 °C jusqu'à ce que les pommes soient dorées et la pâte croustillante (35 à 40 min)."]},{"p":15,"c":35,"m":["Préchauffer le four à 180 °C","Laver et équeuter les cerises (les garder avec noyau pour plus de goût, c'est la tradition)","Beurrer et sucrer un plat"],"s":["Fouetter œufs et sucre, ajouter la farine, puis le lait petit à petit pour obtenir une pâte lisse.","Répartir les cerises dans le plat et verser la pâte.","Cuire à 180 °C jusqu'à ce que le clafoutis soit gonflé et doré (35 min). Servir tiède."]},{"p":15,"c":35,"m":["Préchauffer le four à 180 °C","Éplucher les pommes et les couper en dés","Couper le beurre froid en dés"],"s":["Mettre les pommes dans un plat, saupoudrer de cannelle et de 2 c. à soupe de sucre.","Sabler du bout des doigts farine, sucre restant et beurre froid jusqu'à obtenir une texture de gros sable.","Répartir sur les pommes.","Cuire à 180 °C jusqu'à ce que le dessus soit doré et que les pommes bouillonnent (35 min)."]},{"p":20,"c":0,"m":["Séparer les blancs des jaunes (œufs à température ambiante)","Concasser le chocolat"],"s":["Faire fondre le chocolat et le beurre au bain-marie (ou au micro-ondes par 30 s), laisser tiédir.","Incorporer les jaunes un à un.","Monter les blancs en neige avec une pincée de sel, ajouter le sucre quand ils commencent à mousser, battre jusqu'à ce qu'ils soient fermes et brillants.","Incorporer un tiers des blancs vivement, puis le reste délicatement à la spatule en soulevant.","Répartir en verrines et réfrigérer au moins 3 h."]},{"p":15,"c":45,"m":["Préchauffer le four à 100 °C","Fendre la gousse de vanille et gratter les graines"],"s":["Chauffer la crème avec la vanille jusqu'à frémissement, couvrir et laisser infuser 10 min.","Fouetter les jaunes avec 70 g de sucre sans faire mousser, puis verser la crème chaude en remuant.","Répartir dans des ramequins plats.","Cuire à 100 °C jusqu'à ce que la crème soit prise mais tremblote encore au centre (45 min à 1 h).","Réfrigérer au moins 3 h. Au moment de servir, saupoudrer du reste de sucre et caraméliser au chalumeau ou sous le grill très chaud (2 min)."]},{"p":30,"c":0,"m":["Préparer le café et le laisser refroidir","Séparer les blancs des jaunes"],"s":["Fouetter les jaunes avec le sucre jusqu'à ce que le mélange blanchisse (3 min), ajouter le mascarpone et lisser.","Monter les blancs en neige ferme et les incorporer délicatement.","Tremper rapidement les biscuits dans le café (1 s par face : ils ne doivent pas se détremper) et en tapisser le fond d'un plat.","Couvrir de crème, puis une 2e couche de biscuits et de crème.","Réfrigérer au moins 6 h (idéalement une nuit), puis saupoudrer de cacao juste avant de servir."]},{"p":15,"c":10,"m":["Préchauffer le four à 200 °C","Beurrer et fariner 6 ramequins"],"s":["Faire fondre chocolat et beurre au bain-marie.","Fouetter œufs et sucre, ajouter le chocolat fondu puis la farine.","Remplir les ramequins aux trois quarts (la pâte peut attendre au frais).","Cuire à 200 °C (9 à 10 min) : les bords sont cuits, le centre tremble encore.","Attendre 1 min et démouler sur l'assiette : le cœur coule."]},{"p":15,"c":25,"m":["Préchauffer le four à 180 °C","Chemiser un moule carré de papier cuisson","Concasser les noix"],"s":["Faire fondre chocolat et beurre, laisser tiédir.","Fouetter œufs et sucre, ajouter le chocolat, puis la farine et les noix, sans trop travailler.","Verser dans le moule.","Cuire à 180 °C (22 à 25 min) : un couteau planté au centre doit ressortir avec quelques miettes humides.","Laisser refroidir complètement avant de couper en carrés."]},{"p":15,"c":12,"m":["Sortir le beurre pour qu'il soit mou","Préchauffer le four à 180 °C, couvrir les plaques de papier cuisson"],"s":["Crémer beurre et sucre, ajouter l'œuf.","Incorporer la farine avec 1/2 c. à café de levure et une pincée de sel, puis les pépites.","Former des boules de la taille d'une noix, espacées de 5 cm (elles s'étalent).","Cuire à 180 °C (10 à 12 min) : les bords sont dorés, le centre encore mou.","Laisser 5 min sur la plaque avant de les déplacer : ils durcissent en refroidissant."]},{"p":15,"c":22,"m":["Préchauffer le four à 180 °C","Mettre des caissettes dans un moule à muffins","Faire fondre le beurre"],"s":["Mélanger farine, sucre, levure et sel dans un saladier.","Dans un autre, battre œufs, lait et beurre fondu.","Verser le liquide sur les poudres et mélanger en quelques coups seulement (la pâte doit rester grumeleuse : c'est le secret du moelleux).","Ajouter des pépites ou des fruits si vous voulez, remplir les caissettes aux trois quarts.","Cuire à 180 °C jusqu'à ce qu'ils soient dorés et qu'un cure-dent ressorte sec (20 à 22 min)."]},{"p":15,"c":10,"m":["Faire fondre le beurre, zester le citron","Beurrer et fariner les moules à madeleines"],"s":["Fouetter œufs et sucre jusqu'à ce que le mélange blanchisse (2 min).","Ajouter farine, levure et zeste, puis le beurre fondu tiède.","Réfrigérer la pâte au moins 1 h (le choc chaud-froid donne la bosse).","Préchauffer le four à 220 °C, remplir les moules aux trois quarts.","Enfourner, baisser à 180 °C après 4 min et cuire encore 5 à 6 min jusqu'à ce que les bords soient dorés."]},{"p":15,"c":45,"m":["Préchauffer le four à 170 °C","Beurrer et fariner un moule à cake","Faire fondre le beurre, zester et presser les citrons"],"s":["Fouetter œufs et sucre jusqu'à ce que le mélange blanchisse (3 min).","Ajouter zeste, farine et levure, puis le beurre fondu et la moitié du jus de citron.","Verser dans le moule et cuire à 170 °C jusqu'à ce qu'un couteau ressorte sec (40 à 45 min).","Imbiber le cake chaud d'un sirop : reste du jus + 2 c. à soupe de sucre."]},{"p":30,"c":0,"m":["Laver, équeuter et couper les fraises (garder les plus belles pour le dessus)","Faire un sirop : 10 cl d'eau + 30 g de sucre, laisser refroidir","Mettre crème et bol au congélateur 10 min"],"s":["Fouetter crème froide, mascarpone et le reste du sucre en chantilly ferme.","Tremper rapidement les biscuits dans le sirop et tapisser le fond et les bords d'un moule à charlotte.","Alterner crème et fraises, terminer par des biscuits.","Couvrir d'une assiette avec un poids et réfrigérer au moins 6 h.","Démouler et décorer avec les fraises entières."]},{"p":20,"c":15,"m":["Séparer les blancs des jaunes","Fendre la gousse de vanille"],"s":["Crème anglaise : chauffer le lait avec la vanille. Fouetter les jaunes avec 60 g de sucre, verser le lait chaud dessus, remettre dans la casserole.","Cuire à feu doux en remuant sans arrêt jusqu'à ce que la crème nappe la cuillère (5 min, 83 °C, sans bouillir). Refroidir.","Monter les blancs en neige ferme avec une pincée de sel.","Former des quenelles et les pocher dans de l'eau frémissante (1 min par face) ou au micro-ondes (20 s). Égoutter.","Verser la crème dans des coupes, poser les îles et napper d'un caramel fait avec le reste du sucre (3 à 4 min à sec)."]},{"p":5,"c":40,"m":["Fendre la gousse de vanille","Rincer le riz"],"s":["Blanchir le riz 2 min dans l'eau bouillante, l'égoutter.","Porter le lait à ébullition avec la vanille, ajouter le riz.","Cuire à feu très doux en remuant régulièrement (35 min) jusqu'à ce que le riz soit fondant et crémeux.","Ajouter le sucre en fin de cuisson. Servir tiède ou froid."]},{"p":10,"c":5,"m":["Faire ramollir la gélatine dans un bol d'eau froide (5 min)","Fendre la gousse de vanille"],"s":["Chauffer la crème, le sucre et la vanille jusqu'au frémissement, hors du feu.","Ajouter la gélatine bien essorée et mélanger jusqu'à ce qu'elle fonde.","Répartir dans des verrines et réfrigérer au moins 4 h.","Servir avec un coulis de fruits rouges."]},{"p":15,"c":55,"m":["Préchauffer le four à 170 °C","Beurrer et fariner un moule à cake","Faire fondre le beurre"],"s":["Écraser les bananes à la fourchette.","Mélanger bananes, sucre, œufs et beurre fondu, puis farine, levure et une pincée de sel sans trop travailler.","Verser dans le moule (ajouter des rondelles de banane ou des noix sur le dessus).","Cuire à 170 °C jusqu'à ce qu'un couteau ressorte sec (50 à 55 min). Couvrir d'aluminium s'il dore trop vite."]},{"p":25,"c":50,"m":["Sortir le cream cheese et les œufs 1 h avant (tout doit être à température ambiante)","Préchauffer le four à 160 °C","Chemiser le fond d'un moule à charnière"],"s":["Mixer les biscuits, mélang // durée détectée dans une étape, pour proposer un minuteur : « (8 min) », « (9 à 11 min) », « (1 h 15) », « (1 min 30 par face) »
function stepTime(s) {
  let m = s.match(/\((?:[^()]*?\s)?(\d+)\s*h(?:\s*(\d+))?\)/); if (m && +m[1] <= 4) return (+m[1] * 60 + (+m[2] || 0)) * 60;
  const re = /(\d+)(?:\s*à\s*\d+)?\s*min(?:\s*(\d+))?/;
  const par = [...s.matchAll(/\(([^()]*)\)/g)].map(x => x[1].match(re)).filter(Boolean);
  m = par[0]; if (!m) { const all = [...s.matchAll(new RegExp(re.source, 'g'))]; m = all[all.length - 1]; }
  return m ? (+m[1]) * 60 + (+m[2] || 0) : 0;
}

const WIKI = l => `https://${l}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&pilicense=any`;
async function wikiTitles(lang, titles) {
  const out = {};
  for (let i = 0; i < titles.length; i += 50) {
    const part = titles.slice(i, i + 50);
    try {
      const d = await (await fetch(WIKI(lang) + '&titles=' + encodeURIComponent(part.join('|')))).json();
      const map = {}; part.forEach(t => map[t] = t);
      [...(d.query.normalized || []), ...(d.query.redirects || [])].forEach(n => Object.keys(map).forEach(k => { if (map[k] === n.from) map[k] = n.to; }));
      const pages = Object.values(d.query.pages || {});
      part.forEach(t => { const p = pages.find(x => x.title === map[t]); if (p && p.thumbnail) out[t] = { src: p.thumbnail.source, url: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}` }; });
    } catch (e) { return null; }
  }
  return out;
}
async function wikiSearch(lang, q) {
  try {
    const d = await (await fetch(WIKI(lang) + '&generator=search&gsrlimit=3&gsrsearch=' + encodeURIComponent(q))).json();
    const p = Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index).find(x => x.thumbnail);
    return p ? { src: p.thumbnail.source, url: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}` } : false;
  } catch (e) { return null; }
}
let photoBusy = false;
async function loadPhotos() {
  if (photoBusy || navigator.onLine === false) return; photoBusy = true;
  try {
    let todo = RECIPES.filter(r => !(r.id in photos));
    for (const [lang, k] of [['fr', 0], ['en', 1]]) {
      if (!todo.length) break;
      const got = await wikiTitles(lang, [...new Set(todo.map(r => r.q[k]))]); if (!got) break;
      todo.forEach(r => { if (got[r.q[k]]) photos[r.id] = got[r.q[k]]; });
      todo = todo.filter(r => !(r.id in photos)); savePhotos(); refreshPhotos();
    }
    for (const r of todo) {
      let p = await wikiSearch('fr', r.q[0]); if (p === false) p = await wikiSearch('en', r.q[1]);
      if (p === null) continue; photos[r.id] = p || ''; savePhotos(); refreshPhotos();
    }
  } finally { photoBusy = false; }
}

let timers = [], tick = null, actx = null;
function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d + .3); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .3); }); } catch (e) {} }
function startTimer(sec, label) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
  timers.push({ id: uid(), end: Date.now() + sec * 1000, total: sec, label }); haptic(12); toast('⏱ Minuteur lancé : ' + fmtT(sec)); drawTimers();
  if (!tick) tick = setInterval(drawTimers, 1000);
}
function drawTimers() {
  let box = $('#timers'); if (!box) { box = document.createElement('div'); box.id = 'timers'; document.body.appendChild(box); }
  const now = Date.now();
  timers.forEach(t => { if (!t.rang && t.end <= now) { t.rang = true; beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {} toast('🔔 Temps écoulé : ' + t.label); } });
  box.innerHTML = timers.map(t => { const left = Math.max(0, Math.round((t.end - now) / 1000)); return `<div class="tm ${left ? '' : 'ring'}"><svg viewBox="0 0 36 36" class="tc"><circle cx="18" cy="18" r="15" /><circle cx="18" cy="18" r="15" style="stroke-dasharray:94.2;stroke-dashoffset:${94.2 * (1 - left / t.total)}"/></svg><div><b>${left ? (left >= 3600 ? Math.floor(left / 3600) + ':' + String(Math.floor(left % 3600 / 60)).padStart(2, '0') + ':' : Math.floor(left / 60) + ':') + String(left % 60).padStart(2, '0') : 'Terminé !'}</b><small>${esc(t.label)}</small></div><button onclick="stopTimer('${t.id}')">${I.x}</button></div>`; }).join('');

function daysLeft(e) { if (!e) return Infinity; const [y, m, d] = e.split('-').map(Number), t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(y, m - 1, d) - t) / 864e5); }
function addInv(name, qty = 1, exp = null, silent) {
  name = (name || '').trim(); if (!name) return; qty = Math.max(1, parseInt(qty) || 1);
  const ex = inv.find(i => i.name.toLowerCase() === name.toLowerCase());
  if (ex) { ex.qty += qty; if (exp) ex.expiry = exp; } else inv.push({ id: uid(), name: name[0].toUpperCase() + name.slice(1), qty, expiry: exp || null });
  saveAll(); if (!silent) { haptic(); toast(`🧊 ${name} ajouté`); }
}

let model = null;
const loadScript = src => new Promise((ok, ko) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
const FR = { banana: 'Banane', orange: 'Orange', lemon: 'Citron', 'Granny Smith': 'Pomme', strawberry: 'Fraise', pineapple: 'Ananas', broccoli: 'Brocoli', cauliflower: 'Chou-fleur', cucumber: 'Concombre', zucchini: 'Courgette', 'bell pepper': 'Poivron', mushroom: 'Champignons', 'head cabbage': 'Chou', artichoke: 'Artichaut', corn: 'Maïs', pomegranate: 'Grenade', fig: 'Figue', 'butternut squash': 'Courge', 'spaghetti squash': 'Courge', 'French loaf': 'Baguette', bagel: 'Bagel', pretzel: 'Bretzel', 'cheeseburger': 'Burger', pizza: 'Pizza', 'hotdog': 'Saucisse', eggnog: 'Lait', 'carbonara': 'Pâtes', 'guacamole': 'Avocat', 'meat loaf': 'Viande', 'potpie': 'Tourte', 'ice cream': 'Glace', 'chocolate sauce': 'Chocolat', 'red wine': 'Vin rouge', 'wine bottle': 'Vin', 'beer bottle': 'Bière' };
async function scanImg(input) {
  const f = input.files[0], out = $('#scanOut'); if (!f) return;

      <p class="count" id="eqc" style="text-align:center"></p><div class="foot"><button class="btn pri w" onclick="obNext()">Continuer</button></div></div>`;
    if (step === 2) ob.innerHTML = `<div class="in">${prog()}<h1>Vous êtes combien ?</h1><p class="lead">Les quantités des recettes et des courses seront calculées pour vous.</p>
      <div style="display:flex;justify-content:center;align-items:center;gap:22px;margin:30px 0"><button class="iconbtn" style="width:58px;height:58px;font-size:26px" onclick="obP(-1)">−</button><div style="text-align:center"><div id="pp" style="font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1">${people}</div><div class="mu">personne${people > 1 ? 's' : ''}</div></div><button class="iconbtn" style="width:58px;height:58px;font-size:26px" onclick="obP(1)">+</button></div>
      <div style="font-size:40px;text-align:center;min-height:50px" id="ppl">${'🧑'.repeat(Math.min(people, 8))}</div>
      <div class="foot"><button class="btn pri w" onclick="obNext()">C’est parti !</button><button class="btn ghost w" onclick="obBack()">Retour</button></div></div>`;
    ob.scrollTop = 0;
    if (step === 1) { tileCount = () => { const s = tileSel(ob), n = RECIPES.filter(r => r.needs.every(x => s.includes(x))).length; $('#eqc').textContent = `👉 ${n} recettes réalisables avec cet équipement`; }; tileCount(); }
  };
  window.obBack = () => { step = 1; draw(); };
  window.obP = d => { people = Math.max(1, Math.min(12, people + d)); haptic(6); $('#pp').textContent = people; $('#pp').nextElementSibling.textContent = 'personne' + (people > 1 ? 's' : ''); $('#ppl').textContent = '🧑'.repeat(Math.min(people, 8)); };
  window.obNext = () => {
    haptic(10);
    if (step === 1) { equip = tileSel(ob); if (!equip.length) return toast('Choisissez au moins un ustensile'); }
    if (step === 2) { prefs = { equip, people, v: 1 }; saveAll(); ob.style.transition = 'opacity .35s,transform .35s'; ob.style.opacity = 0; ob.style.transform = 'scale(1.03)'; setTimeout(() => ob.remove(), 350); render(); confetti(); toast('Tout est prêt 🎉'); return; }
    step++; draw();
  };
  draw();
}

// ---------------------------------------------------------------- démarrage
// migration : anciens identifiants numériques
inv.forEach(i => i.id = String(i.id)); shop.forEach(s => s.id = String(s.id));
if (!prefs) { prefs = { equip: Object.keys(EQUIP), people: 2, v: 0 }; onboarding(); }
render();
loadPhotos();
Object.assign(window, { startTimer, stopTimer, go, openRecipe, toggleFav, openFilters, pickSlot, slotMenu, pickRecipe, autoPlan, genShop, addShop, tickShop, delShop, toFridge, addInvForm, qtyInv, addInv, scanImg, openEquip, openSettings, searchOnline, openOnline, closeSheet, haptic, updList, render });

</script>
