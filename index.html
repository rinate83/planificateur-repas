<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FBF7F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garde-Manger">
<title>Mon Garde-Manger</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23E8613C'/><text x='50' y='68' font-size='56' text-anchor='middle'>🥘</text></svg>">
<style>
:root{--bg:#FBF7F1;--card:#fff;--ink:#1E1B18;--mu:#7A7068;--line:#EFE7DD;--soft:#F4EDE4;--pri:#E8613C;--pri2:#F08A5D;--pri-soft:#FDEDE6;--ok:#2F9E6E;--ok-soft:#E3F4EC;--warn:#E9A23B;--dan:#D9483B;
--r:20px;--sh:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.07);--sh2:0 18px 50px rgba(40,25,10,.18);--ease:cubic-bezier(.2,.8,.2,1);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);overflow-x:hidden}
main{overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 12px) 18px 10px;background:rgba(251,247,241,.86);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:17px;letter-spacing:-.02em;display:block}.brand small{color:var(--mu);font-size:12.5px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px rgba(232,97,60,.35)}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
main{padding:4px 18px calc(110px + var(--safe-b));max-width:760px;margin:0 auto}
.view{animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.03em;line-height:1.15;margin:6px 0 4px}
h2{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}.sec h3{font-size:18px;letter-spacing:-.02em}.sec a{color:var(--pri);font-weight:650;font-size:14px;cursor:pointer}
.mu{color:var(--mu)}.small{font-size:13px}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:30;display:flex;gap:2px;padding:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;box-shadow:var(--sh2);width:min(440px,calc(100% - 24px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:18px;color:#9A9089;font-size:10.5px;font-weight:650;position:relative;transition:color .2s}
.tabbar button.on{color:var(--pri)}
.tabbar button.on:before{content:'';position:absolute;inset:0;border-radius:18px;background:var(--pri-soft);z-index:-1;animation:pop .35s var(--ease)}
.tabbar .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--pri);color:#fff;font-size:10px;display:grid;place-items:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* search */
.search{min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 6px 0 14px;box-shadow:var(--sh);height:52px}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.search svg{color:var(--mu)}
.fbtn{height:40px;padding:0 12px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;font-weight:650;font-size:14px;position:relative;transition:transform .15s}
.fbtn svg{width:18px;height:18px}.fbtn:active{transform:scale(.94)}
.fbtn i{position:absolute;top:-5px;right:-5px;background:var(--pri);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--bg)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;height:38px;padding:0 15px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;transition:all .2s var(--ease);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip:active{transform:scale(.95)}
.chip.x{background:var(--pri-soft);color:var(--pri);box-shadow:none;height:32px;font-size:13px;padding:0 10px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.rc{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .2s var(--ease);animation:cardIn .5s var(--ease) both;text-align:left;display:block;width:100%}
.rc:active{transform:scale(.97)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.rc .ph{aspect-ratio:4/3.3}
.rc .bd{padding:10px 12px 12px}.rc .bd b{display:block;font-size:14.5px;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .meta{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--mu);font-size:12.5px}
.ph{position:relative;overflow:hidden;background:linear-gradient(110deg,#F1E8DD 30%,#F8F2EA 50%,#F1E8DD 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;display:grid;place-items:center}
.ph.done{animation:none;background:linear-gradient(135deg,#FCE9DD,#F7EFE3)}
.ph .emo{font-size:42px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.08))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .6s var(--ease);transform:scale(1.04)}
.ph img.ok{opacity:1;transform:none}
.ph img.ok~.emo{display:none}
@keyframes shimmer{to{background-position:-200% 0}}
.tag{position:absolute;z-index:2;top:8px;left:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:9px;padding:3px 8px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px}
.heart{position:absolute;z-index:2;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:transform .2s}
.heart svg{width:18px;height:18px}.heart.on{color:var(--pri)}.heart.on svg{fill:currentColor;animation:beat .45s var(--ease)}
@keyframes beat{30%{transform:scale(1.35)}}
.dots{display:inline-flex;gap:2px}.dots i{width:6px;height:6px;border-radius:50%;background:#E5DCD1}.dots i.f{background:var(--pri)}
.match{height:5px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}.match i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#56C08E);border-radius:3px;transition:width .8s var(--ease)}
/* carrousel */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:4px 18px 10px}.rail::-webkit-scrollbar{display:none}
.rail .rc{flex:none;width:168px;scroll-snap-align:start}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--sh2);cursor:pointer;margin-top:14px;animation:cardIn .6s var(--ease) both;color:#fff}
.hero .ph{aspect-ratio:16/11}
.hero .ov{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(20,10,5,.78));display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.hero small{text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:11px;opacity:.9}
.hero h2{font-size:26px;margin:4px 0 6px;color:#fff}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap}.hero .pills span{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:650}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:var(--card);border-radius:18px;padding:12px 4px 10px;text-align:center;box-shadow:var(--sh);font-size:12px;font-weight:650;transition:transform .15s;animation:cardIn .5s var(--ease) both}
.cat span{display:block;font-size:26px;margin-bottom:4px}.cat:active{transform:scale(.94)}
/* boutons */
.btn{height:52px;border-radius:16px;padding:0 20px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 10px 24px rgba(232,97,60,.32)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.btn.w{width:100%}.btn.sm{height:40px;border-radius:12px;font-size:14px;padding:0 14px}
.btn.ghost{background:none;box-shadow:none;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;animation:cardIn .45s var(--ease) both}
.empty{text-align:center;padding:40px 20px;color:var(--mu)}.empty div{font-size:52px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
/* feuilles */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(25,15,8,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.out{animation:fade .22s reverse forwards}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));animation:up .42s var(--ease);position:relative;overscroll-behavior:contain}
.sheet-bg.out .sheet{animation:up .25s reverse forwards}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:3px;background:#DDD3C7;margin:0 auto 12px}
.sheet .close{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--sh);display:grid;place-items:center}
.sheet .close svg{width:18px;height:18px}
.sheet.full{padding-top:0}
.sheet.full .cover{margin:0 -20px;height:300px;border-radius:28px 28px 0 0}
.sheet.full .grab{position:absolute;top:8px;left:50%;margin-left:-21px;z-index:5;background:rgba(255,255,255,.8)}
.cover.ph .emo{font-size:84px}
.dt{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:20px;z-index:3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:16px}.stat small{color:var(--mu);font-size:11.5px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:4px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-size:18px;font-weight:700}.stepper b{min-width:64px;text-align:center;font-size:14px}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing .q{margin-left:auto;color:var(--mu);font-size:14px;font-weight:600;white-space:nowrap}
.ing .st{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:12px}.ing .st.ok{background:var(--ok-soft);color:var(--ok)}
.step{display:flex;gap:14px;padding:12px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;transition:all .25s}
.step .n{width:30px;height:30px;border-radius:10px;background:var(--pri-soft);color:var(--pri);font-weight:800;display:grid;place-items:center;flex:none;transition:all .25s}
.step.done{opacity:.55}.step.done .n{background:var(--ok);color:#fff}.step.done p{text-decoration:line-through}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools span{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600}
.tools span.miss{background:#FDECEA;color:var(--dan);box-shadow:none}
.bar-actions{position:sticky;bottom:calc(-24px - var(--safe-b));margin:18px -20px calc(-24px - var(--safe-b));padding:12px 20px calc(14px + var(--safe-b));background:linear-gradient(180deg,rgba(251,247,241,0),var(--bg) 30%);display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* formulaires */
.lbl{font-weight:700;font-size:14px;margin:18px 0 10px;display:flex;justify-content:space-between}
.inp{width:100%;height:50px;border-radius:14px;border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);padding:0 14px;font-size:16px;outline:0;transition:box-shadow .2s}
.inp:focus{box-shadow:inset 0 0 0 2px var(--pri)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:650;font-size:13.5px;color:var(--mu);transition:all .2s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.switch{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);cursor:pointer}
.switch .t{flex:1}.switch .t small{display:block;color:var(--mu);font-size:12.5px}
.tg{width:50px;height:30px;border-radius:15px;background:#E2D9CE;position:relative;transition:background .25s;flex:none}.tg:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.tg.on{background:var(--ok)}.tg.on:after{transform:translateX(20px)}
/* ustensiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:18px;padding:14px 12px;text-align:left;box-shadow:inset 0 0 0 1.5px var(--line);transition:all .22s var(--ease);position:relative;animation:cardIn .45s var(--ease) both}
.tile .e{font-size:30px;display:block;margin-bottom:6px;transition:transform .3s var(--ease)}
.tile b{display:block;font-size:14.5px}.tile small{color:var(--mu);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.tile.on{box-shadow:inset 0 0 0 2px var(--pri),0 8px 20px rgba(232,97,60,.15);background:#FFF8F5}
.tile.on .e{transform:scale(1.12) rotate(-6deg)}
.tile:after{content:'✓';position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;transform:scale(0);transition:transform .25s var(--ease)}
.tile.on:after{transform:scale(1)}
/* onboarding */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(var(--safe-t) + 24px) 22px calc(30px + var(--safe-b));animation:fade .3s}
.ob .in{max-width:560px;margin:0 auto}
.ob .big{font-size:76px;text-align:center;margin:40px 0 10px;animation:float 3s ease-in-out infinite}
.ob h1{font-size:32px;text-align:center}
.ob p.lead{text-align:center;color:var(--mu);font-size:16px;margin:8px auto 28px;max-width:400px}
.ob .prog{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.ob .prog i{width:26px;height:6px;border-radius:3px;background:#E6DCD0;transition:all .3s}.ob .prog i.on{background:var(--pri);width:40px}
.feat{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:10px;animation:cardIn .5s var(--ease) both}
.feat span{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--pri-soft);display:grid;place-items:center;flex:none}
.foot{position:sticky;bottom:0;padding-top:16px;background:linear-gradient(180deg,rgba(251,247,241,0),var(--bg) 35%)}
/* planning */
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;animation:cardIn .45s var(--ease) both}
.day.today{box-shadow:inset 0 0 0 2px var(--pri),var(--sh)}
.day h4{display:flex;align-items:center;gap:8px;font-size:15.5px;margin-bottom:10px;text-transform:capitalize}.day h4 em{font-style:normal;background:var(--pri);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px;text-transform:none}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border-radius:16px;overflow:hidden;background:var(--soft);min-height:118px;text-align:left;position:relative;transition:transform .15s;display:flex;flex-direction:column}
.slot:active{transform:scale(.97)}
.slot .ph{height:74px}.slot .ph .emo{font-size:30px}
.slot .sn{padding:7px 10px 9px;font-size:12.5px;font-weight:650;line-height:1.25}.slot .sn small{display:block;color:var(--mu);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.slot.empty{border:2px dashed #E3D8CB;background:none;align-items:center;justify-content:center;color:var(--mu);font-size:13px;font-weight:650;gap:2px}
.slot.empty b{font-size:24px;color:#CBBDAE;font-weight:400}
/* liste */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:8px;animation:cardIn .4s var(--ease) both;transition:opacity .3s,transform .3s}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:15px;font-weight:650}.li .t small{color:var(--mu);font-size:12.5px}
.ck{width:26px;height:26px;border-radius:9px;box-shadow:inset 0 0 0 2px #D8CCBE;display:grid;place-items:center;flex:none;transition:all .25s var(--ease)}
.ck.on{background:var(--ok);box-shadow:none;color:#fff}.ck svg{width:16px;height:16px;stroke-width:3;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}.ck.on svg{opacity:1;transform:none}
.li.done .t b{text-decoration:line-through;color:var(--mu)}
.del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#B9AEA2}.del svg{width:18px;height:18px}
.qbtn{width:30px;height:30px;border-radius:9px;background:var(--soft);font-weight:800}
.badge-exp{font-size:11px;font-weight:750;padding:2px 7px;border-radius:7px;margin-left:6px}.badge-exp.u{background:#FDECEA;color:var(--dan)}.badge-exp.s{background:#FFF4DF;color:#B7791F}.badge-exp.k{background:var(--ok-soft);color:var(--ok)}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#56C08E);border-radius:4px;transition:width .6s var(--ease)}
.aisle{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:18px 4px 8px}
.add{display:flex;gap:8px}.add .inp{flex:1}
.addbtn{width:50px;height:50px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}.addbtn:active{transform:scale(.92)}
.scan{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,#2B2420,#433630);color:#fff;cursor:pointer;box-shadow:var(--sh2)}
.scan span{font-size:30px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.scan small{opacity:.75}
.stag{display:inline-flex;align-items:center;gap:6px;margin:4px;padding:8px 12px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14px;cursor:pointer}
.stag.added{background:var(--ok-soft);color:var(--ok)}
.credit{font-size:11px;color:var(--mu);margin-top:6px}.credit a{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:80;max-width:calc(100% - 40px);text-align:center;box-shadow:var(--sh2)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.count{color:var(--mu);font-size:13.5px;margin:14px 2px 10px}
.pickrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--card);box-shadow:var(--sh);margin-bottom:8px;width:100%;text-align:left;animation:cardIn .35s var(--ease) both}
.pickrow .ph{width:58px;height:58px;border-radius:12px;flex:none}.pickrow .ph .emo{font-size:26px}
.pickrow b{font-size:14.5px;display:block}.pickrow small{color:var(--mu);font-size:12.5px}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const WIKI = l => `https://${l}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&pilicense=any`;
async function wikiTitles(lang, titles) {
  const out = {};
  for (let i = 0; i < titles.length; i += 50) {
    const part = titles.slice(i, i + 50);
    try {
      const d = await (await fetch(WIKI(lang) + '&titles=' + encodeURIComponent(part.join('|')))).json();
      const map = {}; part.forEach(t => map[t] = t);
      [...(d.query.normalized || []), ...(d.query.redirects || [])].forEach(n => Object.keys(map).forEach(k => { if (map[k] === n.from) map[k] = n.to; }));
      const pages = Object.values(d.query.pages || {});
      part.forEach(t => { const p = pages.find(x => x.title === map[t]); if (p && p.thumbnail) out[t] = { src: p.thumbnail.source, url: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}` }; });
    } catch (e) { return null; }
  }
  return out;
}
async function wikiSearch(lang, q) {
  try {
    const d = await (await fetch(WIKI(lang) + '&generator=search&gsrlimit=3&gsrsearch=' + encodeURIComponent(q))).json();
    const p = Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index).find(x => x.thumbnail);
    return p ? { src: p.thumbnail.source, url: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}` } : false;
  } catch (e) { return null; }
}
let photoBusy = false;
async function loadPhotos() {
  if (photoBusy || navigator.onLine === false) return; photoBusy = true;
  try {
    let todo = RECIPES.filter(r => !(r.id in photos));
    for (const [lang, k] of [['fr', 0], ['en', 1]]) {
      if (!todo.length) break;
      const got = await wikiTitles(lang, [...new Set(todo.map(r => r.q[k]))]); if (!got) break;
      todo.forEach(r => { if (got[r.q[k]]) photos[r.id] = got[r.q[k]]; });
      todo = todo.filter(r => !(r.id in photos)); savePhotos(); refreshPhotos();
    }
    for (const r of todo) {
      let p = await wikiSearch('fr', r.q[0]); if (p === false) p = await wikiSearch('en', r.q[1]);
      if (p === null) continue; photos[r.id] = p || ''; savePhotos(); refreshPhotos();
    }
  } finally { photoBusy = false; }
}

function ph(r, cls = '') {

}
function refreshPhotos() {

}

function confetti() { const c = ['#E8613C', '#F0B44C', '#2F9E6E', '#5B8DEF', '#F08A5D']; for (let i = 0; i < 40; i++) { const d = document.createElement('i'); d.className = 'confetti'; d.style.cssText = `left:${Math.random() * 100}vw;background:${c[i % 5]};animation-duration:${1.4 + Math.random() * 1.4}s;animation-delay:${Math.random() * .3}s`; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); } }

// ---------------------------------------------------------------- feuilles (bottom sheets)
function sheet(html, cls = '') {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet ${cls}"><div class="grab"></div><button class="close" onclick="closeSheet(this)">${I.x}</button>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(bg); });
  const sh = bg.firstChild; let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener('touchend', () => { if (y0 == null) return; if (dy > 110) closeSheet(bg); else sh.style.transform = ''; y0 = null; });
  $('#sheets').appendChild(bg); document.body.style.overflow = 'hidden'; return sh;
}
function closeSheet(el) {
  const bg = el && el.closest ? el.closest('.sheet-bg') : $$('.sheet-bg').pop(); if (!bg || bg.classList.contains('out')) return;
  bg.classList.add('out'); bg.firstChild.style.transform = '';
  setTimeout(() => { bg.remove(); if (!$('.sheet-bg')) document.body.style.overflow = ''; }, 230);
}
const closeAll = () => $$('.sheet-bg').forEach(b => closeSheet(b));

const TIMES = [[0, 'Tous'], [15, '≤ 15 min'], [30, '≤ 30 min'], [45, '≤ 45 min'], [60, '≤ 1 h']];
function filtered() {
  const q = F.q.toLowerCase().trim();
  let L = RECIPES.filter(r => (!F.cat || r.category === F.cat) && (!F.time || r.time <= F.time) && (!F.diff || r.difficulty === F.diff) && (!F.tools || canMake(r)) && (!F.fav || favs.includes(r.id)));

}
const nFilters = () => (F.time ? 1 : 0) + (F.diff ? 1 : 0) + (F.cat ? 1 : 0) + (F.fav ? 1 : 0) + (F.stock ? 1 : 0) + (!F.tools ? 0 : 0);

// ---------------------------------------------------------------- FICHE RECETTE
function fmtQty(q, unit, f) {
  let v = q * f; if (/^(g|ml)$/.test(unit)) v = v >= 20 ? Math.round(v / 5) * 5 : Math.round(v); else if (/^(kg|l|cl)$/.test(unit)) v = Math.round(v * 10) / 10; else v = Math.max(.5, Math.round(v * 2) / 2);
  return num(v) + (unit ? ' ' + unit : '');
}
function openRecipe(id, keep) {
  const r = RECIPES.find(x => x.id === id); if (!r) return; haptic();

  const html = `${ph(r, 'cover')}<div class="dt">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><span class="mu small" style="font-weight:700">${CAT_IC[r.category] || ''} ${r.category.toUpperCase()}</span><h2 style="font-size:26px;margin-top:2px">${esc(r.name)}</h2></div>
    <button class="iconbtn heart-big ${favs.includes(r.id) ? 'on' : ''}" style="color:${favs.includes(r.id) ? 'var(--pri)' : 'inherit'}" onclick="toggleFav('${r.id}');this.style.color=favs.includes('${r.id}')?'var(--pri)':'inherit';this.querySelector('svg').style.fill=favs.includes('${r.id}')?'currentColor':'none'">${I.heart.replace('<svg', `<svg style="fill:${favs.includes(r.id) ? 'currentColor' : 'none'}"`)}</button></div>
    ${p && p.src ? `<p class="credit">Photo d’illustration : <a href="${esc(p.url)}" target="_blank" rel="noopener">Wikipédia</a> · licence libre</p>` : ''}
    <div class="stats"><div class="stat"><b>${r.time} min</b><small>Préparation</small></div><div class="stat"><b>${dots(r.difficulty)}</b><small>${r.difficulty}</small></div><div class="stat"><b>${r.ingredients.length}</b><small>Ingrédients</small></div></div>
    ${r.needs.length ? `<div class="lbl">Ustensiles</div><div class="tools">${r.needs.map(n => `<span class="${miss.includes(n) ? 'miss' : ''}">${EQUIP[n][0]} ${EQUIP[n][1]}${miss.includes(n) ? ' — vous n’en avez pas' : ''}</span>`).join('')}</div>` : `<div class="lbl">Ustensiles</div><div class="tools"><span>🔪 Aucun appareil, sans cuisson</span></div>`}
    <div class="lbl" style="align-items:center">Ingrédients<div class="stepper"><button onclick="chgPers(-1)">−</button><b id="pers">${pers} pers.</b><button onclick="chgPers(1)">+</button></div></div>
    <div id="ings">${ings()}</div>
    <div class="lbl">Préparation <span class="mu small" style="font-weight:600">Touchez une étape terminée</span></div>
    ${r.steps.map((s, i) => `<div class="step" onclick="this.classList.toggle('done');haptic(6);checkSteps(this)"><span class="n">${i + 1}</span><p>${esc(s)}</p></div>`).join('')}
    <div class="bar-actions"><button class="btn">🛒 Courses</button><button class="btn pri" onclick="pickSlot('${r.id}')">📅 Planifier</button></div></div>`;

function addMissing(id, f = 1) {

  saveAll(); renderTabs(); haptic(15);
  toast(n ? `🛒 ${n} ingrédient${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} aux courses` : '✅ Tout est déjà en stock ou dans la liste');

// ---------------------------------------------------------------- RECHERCHE EN LIGNE (TheMealDB)
async function searchOnline() {
  const out = $('#online'); if (!out) return; out.innerHTML = '<p class="count">Recherche…</p>';
  try {
    const d = await (await fetch('https://www.themealdb.com/api/json/v1/1/search.php?s=' + encodeURIComponent(F.q.trim()))).json();
    if (!d.meals) { out.innerHTML = '<p class="count">Rien trouvé en ligne (essayez en anglais : chicken, pasta…).</p>'; return; }
    out.innerHTML = `<div class="count">${d.meals.length} résultat(s) en ligne (en anglais)</div><div class="grid">${d.meals.map((m, i) => `<button class="rc" style="animation-delay:${i * 40}ms" onclick="openOnline('${m.idMeal}')"><div class="ph" style="aspect-ratio:4/3.3">${imgTag(m.strMealThumb + '/medium')}<span class="emo">🍽️</span></div><div class="bd"><b>${esc(m.strMeal)}</b><div class="meta">${esc(m.strArea || '')} · ${esc(m.strCategory || '')}</div></div></button>`).join('')}</div>`;
  } catch (e) { out.innerHTML = '<p class="count">Connexion impossible.</p>'; }
}

function daysLeft(e) { if (!e) return Infinity; const [y, m, d] = e.split('-').map(Number), t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(y, m - 1, d) - t) / 864e5); }

      <div class="foot"><button class="btn pri w" onclick="obNext()">C’est parti !</button><button class="btn ghost w" onclick="obBack()">Retour</button></div></div>`;
    ob.scrollTop = 0;
    if (step === 1) { tileCount = () => { const s = tileSel(ob), n = RECIPES.filter(r => r.needs.every(x => s.includes(x))).length; $('#eqc').textContent = `👉 ${n} recettes réalisables avec cet équipement`; }; tileCount(); }
  };
  window.obBack = () => { step = 1; draw(); };
  window.obP = d => { people = Math.max(1, Math.min(12, people + d)); haptic(6); $('#pp').textContent = people; $('#pp').nextElementSibling.textContent = 'personne' + (people > 1 ? 's' : ''); $('#ppl').textContent = '🧑'.repeat(Math.min(people, 8)); };
  window.obNext = () => {
    haptic(10);
    if (step === 1) { equip = tileSel(ob); if (!equip.length) return toast('Choisissez au moins un ustensile'); }
    if (step === 2) { prefs = { equip, people, v: 1 }; saveAll(); ob.style.transition = 'opacity .35s,transform .35s'; ob.style.opacity = 0; ob.style.transform = 'scale(1.03)'; setTimeout(() => ob.remove(), 350); render(); confetti(); toast('Tout est prêt 🎉'); return; }
    step++; draw();
  };
  draw();
}

// ---------------------------------------------------------------- démarrage
// migration : anciens identifiants numériques
inv.forEach(i => i.id = String(i.id)); shop.forEach(s => s.id = String(s.id));
if (!prefs) { prefs = { equip: Object.keys(EQUIP), people: 2, v: 0 }; onboarding(); }
render();
loadPhotos();
Object.assign(window, { go, openRecipe, toggleFav, openFilters, pickSlot, slotMenu, pickRecipe, autoPlan, genShop, addShop, tickShop, delShop, toFridge, addInvForm, qtyInv, addInv, scanImg, openEquip, openSettings, searchOnline, openOnline, closeSheet, haptic, updList, render });
